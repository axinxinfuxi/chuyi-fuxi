"story":{"title":"彭城为什么是兵家必争之地？","text":[
"两千多年前，项羽在彭城定都称西楚霸王，刘邦从沛县起兵——彭城就是今天的徐州，沛县至今属于徐州。刘邦项羽的楚汉相争，垓下之战、四面楚歌，都发生在这片土地上。",
"为什么偏偏是徐州？翻开地图就明白了：徐州地处苏鲁豫皖四省交界，北通京津、南连沪宁，京杭大运河和陇海铁路在这里交汇。谁控制了徐州，谁就掐住了南北交通的咽喉，所以历代打仗都要先抢徐州。",
"一个城市的位置和交通，决定了它在历史舞台上的角色。这就是地理——它不只是书本上的地图，更藏在每一个历史故事和生活选择里。"
],"tip":"学习地理的意义：位置、交通影响城市兴衰。地图三要素是看世界的工具。"},

{"type":"essay","lv":3,"sec":"s2","mat":{"title":"云龙湖导游图","text":["周末，小磊一家去徐州云龙湖游玩。入口处有一张景区导游图，图上的文字说明写着：“图上1厘米代表实地距离500米。”","小磊在图上量得，从景区大门到音乐厅的图上距离是4厘米；这张导游图上没有经纬网，也没有指向标。"]},"subs":[{"q":"这张导游图的比例尺是多少？请写出计算过程。","score":4,"key":["图上1厘米代表实地500米，500米=50000厘米","比例尺=图上距离÷实地距离=1:50000"]},{"q":"从景区大门到音乐厅的实地距离大约是多少米？","score":4,"key":["图上距离是4厘米","实地距离=4×500米=2000米"]},{"q":"如果小磊想在地图上判断大门在音乐厅的什么方向，他应该用什么方法？","score":2,"key":["没有指向标也没有经纬网，用一般定向法","上北下南、左西右东"]}],"why":"比例尺=图上距离÷实地距离，注意单位统一；没有指向标和经纬网时用一般定向法。","q":"阅读材料，回答问题："},
{"type":"essay","lv":3,"sec":"s2","mat":{"title":"给学校画张平面图","text":["小亮所在的学校校园东西长约600米、南北宽约500米。地理课上，老师让大家绘制学校的平面图，图纸长30厘米、宽25厘米。","小亮发现：在世界地图上，整个学校连一个小点都占不到；而在校园平面图上，连花坛、旗杆都能画出来。"]},"subs":[{"q":"为了把600米长的校园画进30厘米宽的图纸，图上1厘米至少应代表实地多少米？","score":4,"key":["600米÷30厘米=20米","图上1厘米代表实地20米"]},{"q":"为什么校园平面图的比例尺比世界地图大？","score":3,"key":["图幅相同时，比例尺越大，表示的范围越小，内容越详细","校园范围小，需要用大比例尺才能画得详细"]},{"q":"平面图上的花坛、旗杆、教学楼，分别用什么来表示？","score":3,"key":["图例（表示各种地理事物的符号）","注记（地图上的文字和数字）"]}],"why":"图幅相同时比例尺越大范围越小内容越详细；图例和注记表示各种地理事物。","q":"阅读材料，回答问题："}

{"id":"s1","name":"第一节 地球与地球仪","mn":"两极稍扁赤道鼓，地轴倾斜66.5°","points":[
{"t":"地球的形状","d":"地球是一个两极稍扁、赤道略鼓的不规则球体。日常生活中看起来是平的，是因为地球太大了。","mn":"两极稍扁、赤道略鼓，不是正球体"},
{"t":"证明地球是球体的证据","d":"①麦哲伦环球航行；②站在海边远望驶来的船，先看到桅杆后看到船身；③月食时地球的影子是圆弧形；④卫星照片直接看到球形。","mn":"麦哲伦航行、先见桅杆、月食圆弧影、卫星照片"},
{"t":"地球的大小","d":"平均半径6371千米；赤道周长约4万千米（“坐地日行八万里”）；表面积约5.1亿平方千米。","mn":"半径6371千米，赤道周长4万千米"},
{"t":"地球仪","d":"地球的模型。地轴是假想的轴（现实中不存在），地轴与水平面成66.5°角倾斜；北极（N）南极（S）是地轴两端。","mn":"地轴是假想轴，与水平面成66.5°角"},
{"t":"纬线与纬度","d":"纬线：与赤道平行、指示东西方向的圆圈；赤道最长，向两极逐渐缩短，最后成一点。纬度：赤道为0°，向北向南各分90°，北纬N南纬S。赤道把地球分成南北半球。","mn":"纬线圆圈指东西，赤道0°分南北半球"},
{"t":"经线与经度","d":"经线：连接南北两极、指示南北方向的半圆，所有经线长度相等。经度：本初子午线（0°经线）向东向西各分180°，东经E西经W。相对的两条经线组成经线圈。","mn":"经线半圆指南北，本初子午线0°起"},
{"t":"东西半球的划分（重点）","d":"不是用0°和180°经线，而是用20°W和160°E组成的经线圈：20°W以东到160°E为东半球，20°W以西到160°E为西半球。","mn":"20°W和160°E分东西半球"},
{"t":"低中高纬度","d":"0°~30°为低纬度，30°~60°为中纬度，60°~90°为高纬度。","mn":"0-30低，30-60中，60-90高"},
{"t":"经纬网定位","d":"经纬网可以确定地球表面任意一点的位置。例如徐州大约位于北纬34°、东经117°。","mn":"经纬网定位置，徐州约34°N、117°E"}
]},
{"id":"s2","name":"第二节 地球的运动","mn":"自转一天昼夜换，公转一年四季变","points":[
{"t":"地球的自转","d":"绕地轴旋转，方向自西向东，周期一天（24小时）。产生的现象：昼夜交替、时间差异（日月星辰东升西落）。","mn":"自转：绕地轴、一天、昼夜交替和时差"},
{"t":"地球的公转","d":"绕太阳旋转，方向自西向东，周期一年。地轴倾斜（66.5°）且指向不变。产生的现象：四季变化、昼夜长短变化、太阳直射点移动、五带划分。","mn":"公转：绕太阳、一年、四季和昼夜长短变化"},
{"t":"太阳直射点的移动","d":"春分（3月21日前后）直射赤道→夏至（6月22日前后）直射北回归线→秋分（9月23日前后）直射赤道→冬至（12月22日前后）直射南回归线。直射点最北到北回归线，最南到南回归线。","mn":"春分秋分射赤道，夏至北回冬至南回"},
{"t":"昼夜长短的变化","d":"夏至日北半球白昼最长、黑夜最短（徐州夏至白天最长）；冬至日北半球白昼最短。赤道上全年昼夜平分。","mn":"夏至北半球昼最长，冬至昼最短"},
{"t":"五带的划分","d":"依据：各地获得太阳热量的多少（有无阳光直射、有无极昼极夜）。热带（有直射）、南北温带（四季分明）、南北寒带（有极昼极夜）。分界线：回归线（23.5°）和极圈（66.5°）。","mn":"热带直射、寒带极昼极夜、温带四季分明"},
{"t":"徐州在哪个带？","d":"徐州位于北纬34°，在北回归线和北极圈之间，属于北温带，四季分明。","mn":"徐州34°N，北温带四季分明"}
]},

{"t":"卫星照片里的地球","d":"航天员从太空看地球，是一颗蓝色的球体。卫星照片是证明地球形状最直观的证据。","mn":"卫星照片最直观：蓝色球体"}

"story":{"title":"麦哲伦的环球航行——一场证明地球是圆的豪赌","text":[
"1519年，葡萄牙航海家麦哲伦带着5艘船、265名水手从西班牙出发，一路向西航行。他们横渡大西洋，穿过南美洲南端的海峡，又花了近4个月穿过风平浪静的太平洋。",
"1521年，麦哲伦在菲律宾群岛卷入部落冲突身亡。剩下的船队继续向西，绕过非洲好望角，1522年回到西班牙——出发时5艘船，回来时只剩1艘船和18个人。",
"但他们带回了一个惊人的事实：一路向西，居然回到了起点！如果地球是平的，船早就开到“大地的尽头”了。环球航行的成功，第一次用行动证明了地球是球体。",
"五百多年后的今天，神舟飞船的航天员们从太空回望地球——那颗蓝色的星球，就是麦哲伦们当年用命去验证的模样。"
],"tip":"证明地球是球体的证据（麦哲伦环球航行、卫星照片、月食、先见桅杆）。地球的运动：自转一天、公转一年。"},

{"t":"海陆比例","d":"地球表面海洋占71%，陆地占29%——“七分海洋，三分陆地”。陆地主要集中在北半球。","mn":"海洋71%陆地29%，陆地主要在北半球"},
{"t":"七大洲","d":"按面积从大到小：亚洲、非洲、北美洲、南美洲、南极洲、欧洲、大洋洲。亚洲最大，大洋洲最小。口诀：“亚非北南美，南极欧大洋”。","mn":"亚非北南美，南极欧大洋"},
{"t":"四大洋","d":"按面积从大到小：太平洋、大西洋、印度洋、北冰洋。太平洋最大最深，北冰洋最小且几乎被冰覆盖。","mn":"太大印北：太平洋大西洋印度洋北冰洋"},

{"t":"赤道穿过的大洲","d":"非洲、亚洲、大洋洲、南美洲。赤道穿过非洲中部。","mn":"赤道穿过非洲中部"}
]},

{"t":"五种基本地形","d":"山地（海拔较高、起伏大、坡度陡）、丘陵（海拔较低、起伏和缓）、高原（海拔较高、顶面平坦辽阔）、平原（海拔较低、地面平坦）、盆地（四周高中间低）。","mn":"山高陡、丘低缓、高原高平、平原低平、盆地四周高中低"},
{"t":"海拔与相对高度","d":"海拔是地面某点高出海平面的垂直距离；相对高度是两点之间的垂直距离。珠穆朗玛峰海拔约8848.86米，是世界最高峰。","mn":"海拔=对海平面，相对高度=两点差"},
{"t":"等高线地形图（重点）","d":"把海拔相同的点连成线。坡度陡缓看疏密：等高线密集坡度陡，稀疏坡度缓。","mn":"等高线密陡疏缓"},
{"t":"山体部位判读","d":"山顶（等高线闭合，中间高）；鞍部（两山顶之间低凹处）；山谷（等高线向高处凸出）；山脊（等高线向低处凸出）；陡崖（多条等高线重叠）。口诀：“凸高为谷，凸低为脊”。","mn":"凸高为谷，凸低为脊；重叠为陡崖"},
{"t":"海底地形","d":"大陆架（近岸浅海）、大陆坡、海沟（最深）、洋盆、大洋中脊（海底山脉）。马里亚纳海沟是世界最深的海沟。","mn":"大陆架→大陆坡→海沟→洋盆→大洋中脊"}
]},

{"t":"大陆漂移说","d":"德国科学家魏格纳提出：全球大陆原来是连在一起的，后来逐渐漂移分离。证据：大西洋两岸大陆轮廓吻合、两岸古生物和地层相似。","mn":"魏格纳：轮廓吻合+两岸化石地层相似"},
{"t":"板块构造学说","d":"全球分为六大板块：亚欧板块、非洲板块、印度洋板块、太平洋板块、美洲板块、南极洲板块。板块内部地壳稳定，板块交界处地壳活跃，多火山、地震。","mn":"六大板块：内部稳，交界处活跃多地震"},
{"t":"两大火山地震带","d":"环太平洋火山地震带（世界上最大）、地中海—喜马拉雅火山地震带。日本、印尼多地震因为位于环太平洋带。","mn":"环太平洋带+地中海—喜马拉雅带"},
{"t":"板块运动实例","d":"喜马拉雅山脉：印度洋板块与亚欧板块碰撞挤压，还在不断升高；红海：非洲板块与印度洋板块张裂，面积不断扩大；地中海在缩小。","mn":"喜马拉雅碰撞升高，红海张裂扩大"}
]},

{"t":"用板块知识理解地震","d":"地震多发生在板块交界处。环太平洋带包括日本、台湾、菲律宾、美国西海岸等；地中海—喜马拉雅带包括我国西南地区。"}
]}

"story":{"title":"魏格纳的“拼图游戏”","text":[
"1910年，德国气象学家魏格纳躺在病床上看墙上的世界地图，突然发现：大西洋两岸的轮廓几乎可以拼在一起——南美洲东海岸的凸出部分，正好嵌进非洲西海岸的凹处！",
"他把这个发现叫做“大陆漂移说”：所有大陆原来是一整块，后来才慢慢漂开。他找到证据：两岸的地层像撕开的报纸一样能对接，还出土了同样的动植物化石。",
"但当时的科学家嘲笑他：大陆怎么可能在海上漂？魏格纳到死都没能看到学说被承认。直到后来人们发现海底在扩张、地壳由板块组成，他的“拼图游戏”才被证明是对的。",
"今天的板块构造学说告诉我们：板块交界处地壳活跃。喜马拉雅山每年还在长高几毫米——印度洋板块和亚欧板块的碰撞，到现在还没有结束。"
],"tip":"板块交界处多火山地震，两大火山地震带；喜马拉雅山是板块碰撞挤压形成；“凸高为谷、凸低为脊”等高线判读。"},

"story":{"title":"房子跟着环境长","text":[
"如果让你设计房子，你会怎么盖？聪明的古人给出了答案——看环境。",
"东南亚终年湿热、地面潮湿，人们把房子架在高高的木桩上：高脚屋。凉风从地板下穿过，蛇虫也爬不进来。西亚沙漠里又干又热，房子就盖成厚墙小窗，白天把热气挡在外面，晚上室内阴凉。",
"北极圈里的因纽特人用冰块砌成冰屋，圆顶没有一丝缝隙，外面的寒风零下几十度，屋里却能靠身体的热量暖和起来。黄土高原上的窑洞往土崖里挖，冬暖夏凉还省材料。",
"你看，房子就是环境的一面镜子。把高脚屋盖到北极会冻僵，把冰屋盖到赤道会融化——先懂环境，再盖房子，这就是聚落与自然环境的关系。"
],"tip":"民居与自然环境：高脚屋—湿热、厚墙小窗—干热、冰屋—寒冷、窑洞—黄土。聚落形成的条件：地形、水源、交通、气候。"},

{"type":"essay","lv":3,"sec":"s1","mat":{"title":"两个地区的人口数据","text":["课堂上，老师给出两个地区的人口数据：甲地区人口出生率为3.2%，死亡率为1.2%；乙地区人口出生率为0.8%，死亡率为1.3%。","甲地区的孩子很多，学校不够用；乙地区街上老人多，医院里排队的也多是老年人。"]},"subs":[{"q":"请分别计算甲、乙两地的人口自然增长率。","score":4,"key":["甲：3.2%−1.2%=2%","乙：0.8%−1.3%=−0.5%","人口自然增长率=出生率−死亡率"]},{"q":"甲、乙两地分别可能面临哪些人口问题？","score":4,"key":["甲人口增长快（过多）：就业困难、住房紧张、交通拥堵、资源环境压力大","乙人口负增长（过少）：劳动力短缺、人口老龄化、养老负担重"]},{"q":"世界人口稠密区主要分布在哪里？","score":2,"key":["亚洲东部和南部、欧洲西部、北美洲东部","大多在中低纬度的近海平原地区"]}],"why":"自然增长率=出生率−死亡率；人口过多和过少都是问题，人口要与资源环境和社会经济发展相适应。","q":"阅读材料，回答问题："},
{"type":"essay","lv":3,"sec":"s4","mat":{"title":"一座古城的烦恼","text":["某古城有上千年的历史，老街、古桥、老宅吸引了大量游客。可是问题也来了：一些游客在墙上刻字，沿街老宅被改成现代商铺，游客太多把石板路都磨坏了。","当地政府开始想办法：修复老建筑要“修旧如旧”，限制每天进城的游客数量，向游客宣传保护知识。"]},"subs":[{"q":"为什么要保护文化遗产？","score":4,"key":["文化遗产是历史的见证、文化的载体","一旦破坏无法再生"]},{"q":"材料中当地政府采取了哪些保护措施？","score":4,"key":["修旧如旧","控制游客数量","加强宣传教育"]},{"q":"作为中学生，参观文化遗产时应该怎么做？","score":2,"key":["文明游览，不乱刻乱画","了解文化遗产背后的知识，向身边人宣传保护"]}],"why":"文化遗产是历史的见证、文化的载体，一旦破坏无法再生：修旧如旧、控制游客、加强宣传，人人文明游览。","q":"阅读材料，回答问题："}
]}
]},
{"id":"u5","name":"第5章 世界的气候","emoji":"🌦️","chapters":[
{"id":"c5","name":"第5章 世界的气候","emoji":"🌦️","sections":[
{"id":"s1","name":"第一节 天气与天气预报","mn":"天气短时多变，气候多年平均","points":[
{"t":"天气与气候的区别（必考）","d":"天气：某个地方短时间里的大气状况，多变（如“今天晴转多云”）；气候：一个地方多年的天气平均状况，稳定（如“徐州夏季高温多雨、冬季寒冷干燥”）。","mn":"天气短多变，气候多年均"},
{"t":"天气预报","d":"用天气符号表示天气状况（晴、多云、阴、雨、雪、风、雾等）。看天气预报要会认符号。"},
{"t":"天气与生活","d":"天气影响出行、穿衣、农业、体育比赛。雷雨天不在树下避雨；雾霾天减少户外活动。"},
{"t":"徐州的天气","d":"徐州今天的具体晴雨冷热是天气；徐州“夏季高温多雨、冬季寒冷干燥”是气候（温带季风气候）。","mn":"徐州夏热多雨、冬冷干燥=温带季风气候"}
]},
{"id":"s2","name":"第二节 气温和降水","mn":"最高温午后2时，每升100米降0.6℃","points":[
{"t":"气温的观测","d":"用温度计放在百叶箱中测量，一般每天观测4次（2时、8时、14时、20时），取平均得到日平均气温。","mn":"百叶箱测温，每天4次取平均"},
{"t":"气温的日变化","d":"一天中最高气温出现在午后2时（14时）左右，最低气温出现在日出前后。气温日较差=日最高−日最低。","mn":"最高午后2时，最低日出前后"},
{"t":"气温的分布规律","d":"①纬度因素：低纬度气温高，高纬度气温低；②海拔：每升高100米，气温约下降0.6℃；③海陆：同纬度夏季陆地热海洋凉，冬季相反。","mn":"低纬热高纬冷；每升100米降0.6℃"},
{"t":"降水的形成与测量","d":"空气上升冷却，水汽凝结成云致雨。降水量用雨量器测量，单位是毫米。","mn":"雨量器量降水，单位毫米"},
{"t":"世界降水的分布","d":"赤道附近多（赤道多雨）；两极少；回归线附近大陆东岸多、西岸少；中纬度沿海多、内陆少。世界“雨极”：印度乞拉朋齐。","mn":"赤道多、两极少；沿海多、内陆少"}
]},
{"id":"s3","name":"第三节 影响气候的因素","mn":"纬度定带、海陆定水、地形看局部","points":[
{"t":"纬度因素（基本因素）","d":"纬度低→气温高，纬度高→气温低；赤道地区降水多，两极降水少。","mn":"纬度是基本因素，决定热量带"},
{"t":"海陆因素","d":"同纬度：沿海降水多、内陆降水少；沿海气温年较差小，内陆年较差大。","mn":"沿海降水多年较差小，内陆相反"},
{"t":"地形因素","d":"海拔升高气温降低（每100米约降0.6℃）；山地迎风坡降水多，背风坡降水少。“一山有四季，十里不同天”。","mn":"一山有四季，十里不同天"},
{"t":"综合运用","d":"判断“某地气候为什么这样”，先看纬度（定气温带），再看海陆（定降水多少），最后看地形（局部差异）。","mn":"先纬度、再海陆、后地形"}
]},
{"id":"s4","name":"第四节 世界主要气候类型","mn":"以温定带，以水定型","points":[
{"t":"热带气候","d":"热带雨林气候（赤道附近，全年高温多雨）、热带草原气候（干湿季分明）、热带季风气候、热带沙漠气候（回归线附近大陆内部和西岸，全年炎热干燥）。"},
{"t":"温带气候","d":"温带海洋性气候（中纬度大陆西岸，全年温和湿润）、温带大陆性气候（内陆，冬冷夏热降水少）、温带季风气候（大陆东岸，夏季高温多雨、冬季寒冷干燥——徐州就是这种）。","mn":"徐州温带季风：夏热多雨、冬冷干燥"},
{"t":"寒带气候和高原山地气候","d":"寒带气候（两极，终年寒冷干燥）；高原山地气候（海拔高，气温低，“高处不胜寒”）。"},
{"t":"气候资料的表示","d":"气温曲线图表示各月气温，降水柱状图表示各月降水量。判读口诀：以“温”定带（最冷月气温定热量带），以“水”定型（降水季节分配定气候类型）。","mn":"以温定带，以水定型"}
]},
{"id":"s5","name":"探究与实践 看云识天气","mn":"朝霞不出门，晚霞行千里","points":[
{"t":"云的学问","d":"云的种类和形状能预报天气：积雨云浓厚高大→雷阵雨；卷云像羽毛→天气晴好。民间谚语：“朝霞不出门，晚霞行千里”。","mn":"积雨云高浓→雷阵雨；卷云如羽→晴好"},
{"t":"做个小气象员","d":"每天记录气温、风向、云量，坚持一个月，就能发现自己家乡的天气变化规律——这就是最简单的气象观测。"}
]}
],
"keypoints":[
{"t":"天气与气候的区分","d":"判断标准：时间长短和稳定性。带“今天、明天”的是天气；带“夏季、全年、多年”的是气候。描述气候的两个要素：气温和降水。","mn":"今天明天是天气，夏季全年是气候"},
{"t":"气温的时空分布","d":"日最高温在14时左右（不是正午！）；纬度低气温高；海拔每100米降0.6℃。这三条是高频考点。","mn":"最高14时非正午；低纬热；每100米降0.6℃"},
{"t":"影响气候的三因素","d":"纬度（基本）、海陆、地形。“一山有四季”是地形；“人间四月芳菲尽，山寺桃花始盛开”也是地形（海拔）。","mn":"纬度·海陆·地形"},
{"t":"气候图的判读","d":"以“温”定带：最冷月气温＞15℃是热带；0℃～15℃是亚热带或温带海洋性；＜0℃是温带；以“水”定型：全年多雨是雨林气候，夏季多雨冬季干燥是季风气候。","mn":"最冷月定带，降水定类型"}
],
"traps":[

{"w":"一天中最高气温出现在正午12点","r":"最高气温出现在午后2时（14时）左右。地面先吸热，热量传给大气需要时间。"},

{"w":"影响气候的基本因素是海陆因素","r":"纬度因素是影响气候的基本因素，它决定了热量带；海陆和地形是重要因素。"},
{"w":"“山寺桃花始盛开”说明光影响气候","r":"山上海拔高、气温低，桃花开得晚，是地形（海拔）影响气温。"},

],
"story":{"title":"看云识天气——天空的“表情包”","text":[
"天上飘着什么样的云，就藏着什么样的天气秘密。棉花糖一样的积云，说明天气晴好；但如果云越积越高、顶部像花菜一样鼓起来，变成乌黑的积雨云，一场雷阵雨就不远了。",
"古人早就总结了看云的本事，编成谚语：“朝霞不出门，晚霞行千里”——早上有霞，水汽多要下雨；傍晚有霞，明天多半是晴天。“天上钩钩云，地上雨淋淋”。",
"现代天气预报靠卫星云图：白色的云团、绿色的陆地、蓝色的海洋。气象卫星在几百公里高的太空盯着云彩，预报员再结合气温、气压数据，才能告诉你明天出门带不带伞。",
"下次抬头看天，先当一回小小气象员：今天的云，是什么“表情”？"
],"tip":"天气（短时多变）与气候（长期稳定）的区别；天气符号；气温14时最高、海拔每100米降0.6℃。"},

{"type":"essay","lv":3,"sec":"s4","mat":{"title":"一座城市的气候档案","text":["地理课上，老师展示了一座城市的气温曲线和降水柱状图：1月平均气温约−2℃，降水量约10毫米；7月平均气温约27℃，降水量约180毫米；全年降水量约600毫米。","这座城市的夏季降水多，冬季降水少；冬天气温在0℃以下，夏天炎热。"]},"subs":[{"q":"该城市最冷月气温在0℃以下，降水集中在夏季。按“以温定带、以水定型”，它最可能属于什么气候类型？","score":4,"key":["温带季风气候","最冷月气温＜0℃是温带；夏季多雨、冬季干燥是季风气候"]},{"q":"这类气候的显著特点是什么？","score":3,"key":["夏季高温多雨","冬季寒冷干燥"]},{"q":"同纬度的沿海地区和内陆地区相比，气温年较差和降水有什么差异？","score":3,"key":["沿海降水多、气温年较差小","内陆降水少、气温年较差大"]}],"why":"以温定带：最冷月＜0℃是温带；以水定型：夏雨冬干是季风气候。沿海受海洋调节，温差小降水多。","q":"阅读材料，回答问题："},
{"type":"essay","lv":3,"sec":"s3","mat":{"title":"山寺桃花为什么开得晚？","text":["唐代诗人白居易写道：“人间四月芳菲尽，山寺桃花始盛开。”四月山下平地的桃花已经谢了，山顶寺庙旁的桃花才刚刚盛开。","小明暑假去爬一座山：山脚海拔200米处气温25℃，山顶海拔1200米。他带了短袖，可到了山顶却感觉凉飕飕的。"]},"subs":[{"q":"“人间四月芳菲尽，山寺桃花始盛开”反映了什么因素对气候的影响？","score":2,"key":["地形因素","海拔（地形）"]},{"q":"按海拔每升高100米气温约下降0.6℃计算，山顶的气温大约是多少？","score":4,"key":["相对高度=1200米−200米=1000米","气温下降1000÷100×0.6℃=6℃","山顶气温约25℃−6℃=19℃"]},{"q":"山地降水有什么特点？","score":2,"key":["迎风坡降水多","背风坡降水少"]}],"why":"地形影响气候：海拔高气温低；迎风坡降水多、背风坡降水少。","q":"阅读材料，回答问题："}
]}

"story":{"title":"中欧班列：现代丝路上的“钢铁驼队”","text":[
"两千年前，张骞出使西域，驼队驮着丝绸和茶叶，走一年才能从长安到罗马。今天，一条钢铁丝路把这段旅程缩短到了十几天。",
"中欧班列从中国出发，一路向西穿过哈萨克斯坦、俄罗斯，直达德国的杜伊斯堡。一列火车能装几百个集装箱：中国的手机、玩具、光伏板运出去，欧洲的汽车零件、奶粉、红酒运回来。海运要40天，班列只要16天。",
"这条铁路带来了什么？沿线城市建起了物流园，工厂有了订单，老百姓买到了便宜的进口商品。这就是国际合作：各国发挥自己的优势，货物流通，共同发展。",
"咱徐州是陇海铁路上的重要枢纽，货物从这里集散运往欧洲。地理课本上的“国际合作”，就写在每天出发的班列里。"
],"tip":"“南北对话”与“南南合作”的含义；联合国是最大的国际组织；交通运输是经济发展的先行官。"},

<script>
'use strict';
const DATA = JSON.parse(document.getElementById('DATA').textContent);
const app = document.getElementById('app');
function lsGet(k,f){try{const v=localStorage.getItem('dili_'+k);return v==null?f:JSON.parse(v);}catch(e){return f;}}
function lsSet(k,v){try{localStorage.setItem('dili_'+k,JSON.stringify(v));return true;}catch(e){return false;}}
const KIND={choice:{n:'选择'},tf:{n:'判断'},fill:{n:'填空'},order:{n:'排序'},essay:{n:'材料'}};
const RANKS=[{n:'青铜',min:0,ic:'🥉'},{n:'白银',min:50,ic:'🥈'},{n:'黄金',min:150,ic:'🥇'},{n:'王者',min:350,ic:'👑'}];
const state={view:'home',unit:0,ch:0,quiz:null,tab:'points',pick:{show:false,secs:[],lvs:[1,2,3]}};
const PRAISE=['太棒了！🎉','厉害！👏','满分选手就是你！🏆','继续保持！💪','真不错！⭐','完全正确！🎯','好样的！🚀'];
const TRYAGAIN=['没关系，记下解析，再练一遍就会了！💪','别灰心，错题已进错题本，下次一定行！📕','进步都是从错题开始的！🌱'];
function qKind(it){return it.t||it.type||'choice';}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function ymd(d){d=d||new Date();return ''+d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0');}
function shuffle(a,seed){
  const arr=a.slice();
  if(seed==null){for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}return arr;}
  let s=seed>>>0;const rnd=()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296;};
  for(let i=arr.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}
  return arr;
}
function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function navActive(){document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.v===state.view));}
function updateBadge(){const wb=lsGet('wrongbook',[]);const b=document.getElementById('wbadge');b.textContent=wb.length||'';b.style.display=wb.length?'inline-block':'none';}
function allChapters(){const r=[];DATA.units.forEach((u,ui)=>u.chapters.forEach((c,ci)=>r.push({u:ui,c:ci,ch:c})));return r;}
function chapterDone(uid,cid){return !!lsGet('done_'+uid+'_'+cid,false);}
function setDone(uid,cid,v){lsSet('done_'+uid+'_'+cid,v);}
function wrongCount(){return lsGet('wrongbook',[]).length;}
function keyOf(w){return w.qi!=null?w.chid+'|i'+w.qi:w.chid+'|q'+w.q;}
function wrongAdd(q){
  let wb=lsGet('wrongbook',[]);
  if(!wb.some(w=>keyOf(w)===keyOf(q))){wb.unshift(q);lsSet('wrongbook',wb);}
  updateBadge();
}
function wrongRemove(q){
  let wb=lsGet('wrongbook',[]).filter(w=>keyOf(w)!==keyOf(q));
  lsSet('wrongbook',wb);updateBadge();
}
function statsAdd(ok,essayGot){const s=lsGet('stats',{ans:0,right:0,essay:0});s.ans++;if(ok)s.right++;if(essayGot)s.essay+=essayGot;lsSet('stats',s);}
function rankOf(right){let r=RANKS[0];for(const x of RANKS){if(right>=x.min)r=x;}return r;}
function rankNext(right){for(const x of RANKS){if(right<x.min)return x;}return null;}
let timerId=null;
function stopTimer(){if(timerId!=null){clearInterval(timerId);timerId=null;}}
function ensureTimer(){
  const qz=state.quiz;if(!qz||!qz.deadline)return;
  if(timerId!=null)return;
  const tick=()=>{
    const el=document.getElementById('timer');
    if(!el){stopTimer();return;}
    const left=qz.deadline-Date.now();
    if(left<=0){stopTimer();el.textContent='⏱ 0:00';finishQuiz();return;}
    const m=Math.floor(left/60000),s=Math.floor(left%60000/1000);
    el.textContent='⏱ '+m+':'+String(s).padStart(2,'0');
  };
  tick();
  timerId=setInterval(tick,1000);
}
function render(){
  updateBadge();navActive();
  if(state.view!=='quiz')stopTimer();
  if(state.view==='home')renderHome();
  else if(state.view==='chapters')renderChapters();
  else if(state.view==='chapter')renderChapter();
  else if(state.view==='quiz')renderQuiz();
  else if(state.view==='wrong')renderWrong();
  else if(state.view==='gates')renderGates();
  else if(state.view==='rank')renderRank();
  else if(state.view==='mnemo')renderMnemo();
  else if(state.view==='daily')renderDaily();
  else if(state.view==='about')renderAbout();
  window.scrollTo(0,0);
}
/* ---------- 首页 ---------- */
function renderHome(){
  const st=lsGet('stats',{ans:0,right:0});
  const r=rankOf(st.right),nx=rankNext(st.right);
  const dk='daily_'+ymd();
  const dv=lsGet(dk,null);
  const pct=nx?Math.round(st.right/Math.max(nx.min,1)*100):100;
  let h='<div class="rank-card" onclick="goView(\'rank\')">'
    +'<div class="rank-top"><div class="rank-ic">'+r.ic+'</div><div><div class="rank-name">'+r.n+'段位 · 已答对 '+st.right+' 题</div>'
    +'<div class="rank-sub">'+(nx?('再答对 '+(nx.min-st.right)+' 题升到 '+nx.n+' '+nx.ic):'已是最高段位！')+'</div></div></div>'
    +'<div class="rank-pbar"><i style="width:'+Math.min(pct,100)+'%"></i></div></div>';
  h+='<div class="daily-card" onclick="goView(\'daily\')"><div class="dc-ic">⚡</div>'
    +'<div class="dc-info"><div class="dc-t">每日挑战</div>'
    +'<div class="dc-s">'+(dv?('今日最高 '+dv.best+' 分 · 可反复刷'):'今天还没挑战 · 随机10题 · 限时5分钟')+'</div></div>'
    +'<div class="dc-go">'+(dv?'再战':'开战')+' ›</div></div>';
  h+='<h2 class="sec">📚 选择单元开始复习</h2>';
  DATA.units.forEach((u,ui)=>{
    const chs=u.chapters;
    const done=chs.filter(c=>chapterDone(u.id,c.id)).length;
    h+='<div class="card unit-card" onclick="openUnit('+ui+')">'
      +'<div class="unit-emoji">'+u.emoji+'</div>'
      +'<div class="unit-info"><div class="unit-name">'+esc(u.name)+'</div>'
      +'<div class="unit-meta">'+chs.length+'章 · 已掌握 '+done+'/'+chs.length+'</div>'
      +'<div class="pbar"><i style="width:'+(chs.length?Math.round(done/chs.length*100):0)+'%"></i></div></div>'
      +'<div class="unit-arrow">›</div></div>';
  });
  h+='<div class="daily-card" style="border-color:#d8e6ff;background:linear-gradient(120deg,#f2f7ff,#fbfdff)" onclick="goView(\'mnemo\')">'
    +'<div class="dc-ic">🧠</div><div class="dc-info"><div class="dc-t" style="color:#2563a8">记忆口诀卡</div>'
    +'<div class="dc-s">把知识点编成顺口溜，背得快记得牢</div></div><div class="dc-go" style="color:#2563a8">查看 ›</div></div>';
  app.innerHTML=h+'<div class="card about"><p style="font-size:.8rem;color:#8a97a3">💡 学完一章后做“练习”，答对率60%以上自动标记为已掌握；答错的题自动进“错题本”，可以反复重做。</p></div>';
}
function goView(v){state.view=v;render();}
function openUnit(ui){state.unit=ui;state.view='chapters';render();}
function goHome(){state.view='home';render();}
/* ---------- 章节 ---------- */
function renderChapters(){
  const u=DATA.units[state.unit];
  let h='<div class="back-row"><button class="back-btn" onclick="goHome()">← 返回</button><div class="ch-title">'+u.emoji+' '+esc(u.name)+'</div></div>';
  u.chapters.forEach((c,ci)=>{
    const d=chapterDone(u.id,c.id);
    h+='<div class="card unit-card" onclick="openChapter('+ci+')">'
      +'<div class="unit-emoji" style="font-size:1.5rem">'+c.emoji+'</div>'
      +'<div class="unit-info"><div class="unit-name">'+esc(c.name)+(d?'<span class="done-flag">✓ 已掌握</span>':'')+'</div>'
      +'<div class="unit-meta">'+c.sections.length+'节 · 练习'+c.quiz.length+'题</div></div>'
      +'<div class="unit-arrow">›</div></div>';
  });
  app.innerHTML=h;
}
function openChapter(ci){state.ch=ci;state.view='chapter';state.tab='points';state.pick={show:false,secs:[],lvs:[1,2,3]};render();}
function goBackChapters(){state.view='chapters';render();}
function setTab(t){state.tab=t;render();}
function renderChapter(){
  const u=DATA.units[state.unit],c=u.chapters[state.ch];
  const tabs=[['points','📖 知识点'],['key','🎯 重点'],['trap','⚠️ 易错'],['story','📚 故事'],['quiz','✍️ 练习']];
  let tabh='<div class="tabs">'+tabs.map(t=>'<button class="tab'+(state.tab===t[0]?' active':'')+'" onclick="setTab(\''+t[0]+'\')">'+t[1]+'</button>').join('')+'</div>';
  let body='';
  if(state.tab==='points'){
    body=c.sections.map(s=>{
      const pts=s.points.map(p=>'<div class="pt'+(p.k?' key':'')+'"><div class="pt-t">'+(p.k?'':'▫️ ')+esc(p.t)+'</div><div class="pt-d">'+esc(p.d)+'</div>'+(p.mn?'<div class="pt-mn">'+esc(p.mn)+'</div>':'')+'</div>').join('');
      return '<div class="card"><div style="font-weight:800;font-size:.9rem;color:#2b4a3d;margin-bottom:8px">'+esc(s.name)+(s.mn?'<span style="font-size:.72rem;color:#b08a1a;margin-left:6px">🧠'+esc(s.mn)+'</span>':'')+'</div>'+pts+'</div>';
    }).join('');
  }else if(state.tab==='key'){
    body='<div class="card">'+c.keypoints.map(k=>'<div class="pt key"><div class="pt-t">'+esc(k.t)+'</div><div class="pt-d">'+esc(k.d)+'</div>'+(k.mn?'<div class="pt-mn">'+esc(k.mn)+'</div>':'')+'</div>').join('')+'</div>';
  }else if(state.tab==='trap'){
    body='<div class="card">'+c.traps.map(t=>'<div class="trap"><div class="w">'+esc(t.w)+'</div><div class="r">'+esc(t.r)+'</div></div>').join('')+'</div>';
  }else if(state.tab==='story'){
    body='<div class="story"><div class="st-t">📖 '+esc(c.story.title)+'</div>'
      +c.story.text.map(p=>'<p>'+esc(p)+'</p>').join('')
      +'<div class="st-tip">'+esc(c.story.tip)+'</div></div>';
  }else if(state.tab==='quiz'){
    body=renderQuizPanel(u,c);
  }
  const d=chapterDone(u.id,c.id);
  app.innerHTML='<div class="back-row"><button class="back-btn" onclick="goBackChapters()">← 返回</button><div class="ch-title">'+c.emoji+' '+esc(c.name)+(d?'<span class="done-flag">✓ 已掌握</span>':'')+'</div></div>'
    +tabh+body
    +'<button class="btn2" onclick="toggleDone()">'+(d?'✓ 已标记掌握（点此取消）':'☆ 手动标记本章已复习')+'</button>';
}
function toggleDone(){
  const u=DATA.units[state.unit],c=u.chapters[state.ch];
  setDone(u.id,c.id,!chapterDone(u.id,c.id));render();
}
/* ---------- 练习面板（全部 / 自选 / 闯关） ---------- */
function renderQuizPanel(u,c){
  const byT={},byLv={};
  c.quiz.forEach(q=>{const t=qKind(q);byT[t]=(byT[t]||0)+1;const lv=q.lv||1;byLv[lv]=(byLv[lv]||0)+1;});
  let h='<div class="card"><div style="font-weight:800;font-size:.92rem;color:#2b4a3d">✍️ 本章练习（'+c.quiz.length+'题）</div>'
    +'<div style="font-size:.78rem;color:#8a97a3;line-height:1.6;margin:6px 0 10px">题型：'+Object.keys(byT).map(t=>KIND[t].n+byT[t]).join(' · ')+'　难度：基础'+byLv[1]+' 进阶'+byLv[2]+' 挑战'+byLv[3]+'</div>'
    +'<button class="next-btn" onclick="startQuiz(\'chapter\')">开始练习（全部） 🚀</button>'
    +'<button class="btn2" onclick="togglePickPanel()">🎯 自选知识点练习'+(state.pick.show?'（收起）':'')+'</button>'
    +'<button class="btn2" onclick="goView(\'gates\')">🎮 闯关模式（逐节解锁）</button></div>';
  if(state.pick.show){
    const secs=c.sections.map((s,si)=>({id:s.id||('s'+(si+1)),name:s.name}));
    const pc=state.pick;
    const poolCount=c.quiz.filter(q=>{const it=mkItem(q,u.id,c.id,0,u.emoji+' '+c.name);return (!it.sec||pc.secs.includes(it.sec))&&pc.lvs.includes(it.lv);}).length;
    h+='<div class="card"><div style="font-weight:800;font-size:.88rem;color:#2b4a3d;margin-bottom:8px">选择知识点（节）</div>'
      +secs.map(s=>'<div class="pick-sec'+(pc.secs.includes(s.id)?' on':'')+'" onclick="toggleSecPick(\''+s.id+'\')"><input type="checkbox" '+(pc.secs.includes(s.id)?'checked':'')+' disabled><span class="ps-name">'+esc(s.name)+'</span><span class="ps-n">'+c.quiz.filter(q=>(q.sec||null)===s.id).length+'题</span></div>').join('')
      +'<div style="font-weight:800;font-size:.88rem;color:#2b4a3d;margin:10px 0 8px">选择难度</div>'
      +'<div class="lv-row">'+[1,2,3].map(l=>'<div class="lv-btn'+(pc.lvs.includes(l)?' on':'')+'" onclick="toggleLvPick('+l+')">'+['基础','进阶','挑战'][l-1]+'</div>').join('')+'</div>'
      +'<button class="next-btn" onclick="startQuiz(\'custom\')">开始自选练习（'+poolCount+'题）</button></div>';
  }
  return h;
}
function togglePickPanel(){
  const pc=state.pick;
  pc.show=!pc.show;
  if(pc.show&&!pc.secs.length){
    const c=DATA.units[state.unit].chapters[state.ch];
    pc.secs=c.sections.map((s,si)=>s.id||('s'+(si+1)));
  }
  render();
}
function toggleSecPick(id){const pc=state.pick;const i=pc.secs.indexOf(id);if(i<0)pc.secs.push(id);else pc.secs.splice(i,1);render();}
function toggleLvPick(l){const pc=state.pick;const i=pc.lvs.indexOf(l);if(i<0)pc.lvs.push(l);else pc.lvs.splice(i,1);render();}
/* ---------- 组卷 ---------- */
function mkItem(q,uid,cid,qi,chn){
  return Object.assign({t:qKind(q),lv:q.lv||1,pt:q.pt||1,sec:q.sec||null,chid:uid+'_'+cid,chn,qi},q);
}
function poolOfChapter(uid,cid){
  const u=DATA.units[uid],c=u.chapters[cid];
  return c.quiz.map((q,qi)=>mkItem(q,u.id,c.id,qi,u.emoji+' '+c.name));
}
function poolOfAll(){
  const r=[];
  DATA.units.forEach((u,ui)=>u.chapters.forEach((c,ci)=>r.push.apply(r,poolOfChapter(ui,ci))));
  return r;
}
function startQuiz(mode,extra){
  extra=extra||{};
  const qz={i:0,got:0,score:0,objScore:0,objN:0,max:0,wrong:[],done:false,mode:mode,deadline:null,work:{}};
  if(mode==='wrong'){
    const wb=lsGet('wrongbook',[]);
    if(!wb.length){return;}
    qz.list=wb.map(w=>Object.assign({},w,{t:w.t||'choice'}));
    qz.title='错题重做';
  }else if(mode==='daily'){
    qz.list=shuffle(poolOfAll(),hashStr(ymd())).slice(0,10);
    qz.title='每日挑战';
    qz.deadline=Date.now()+5*60000;
  }else if(mode==='gate'){
    const u=DATA.units[state.unit],c=u.chapters[state.ch];
    const si=extra.si;const sid=c.sections[si].id||('s'+(si+1));
    qz.list=poolOfChapter(state.unit,state.ch).filter(it=>it.sec===sid);
    qz.title='闯关 · '+c.sections[si].name;
    qz.gateSi=si;qz.gateSid=sid;
  }else{
    const u=DATA.units[state.unit],c=u.chapters[state.ch];
    let pool=poolOfChapter(state.unit,state.ch);
    if(mode==='custom'){
      const pc=state.pick;
      pool=pool.filter(it=>((!it.sec||pc.secs.includes(it.sec))&&pc.lvs.includes(it.lv)));
      if(!pool.length){alert('所选范围内没有题目，请调整选择。');return;}
      qz.title='自选练习';
    }else{
      qz.title='本章练习';
    }
    qz.list=shuffle(pool);
  }
  if(!qz.list.length){alert('这个范围内没有题目。');return;}
  qz.list.forEach(it=>{const t=qKind(it);if(t!=='essay'){qz.max+=(it.pt||1);qz.objN++;}else{qz.max+=(it.subs||[]).reduce((a,s)=>a+(s.score||0),0);}});
  state.quiz=qz;state.view='quiz';render();
}

    +'<div class="qbar"><i style="width:'+pct+'%"></i></div>'

  else if(t==='tf')mid='<div class="judge-row"><button class="opt" onclick="pick(0)">✔ 正确</button><button class="opt" onclick="pick(1)">✘ 错误</button></div>';

/* ---------- 判分 ---------- */
function normAns(s){return String(s).replace(/\s+/g,'').replace(/[，。、；：！？,.;:!?（）()]/g,'').toLowerCase();}
function nearMiss(a,b){
  a=normAns(a);b=normAns(b);
  if(Math.abs(a.length-b.length)>1)return false;
  if(a===b)return true;
  const s=a.length<b.length?a:b,l=a.length<b.length?b:a;
  if(s.length===l.length){let d=0;for(let i=0;i<s.length;i++){if(s[i]!==l[i])d++;}return d<=1;}
  let i=0,j=0,d=0;while(i<s.length&&j<l.length){if(s[i]!==l[j]){d++;j++;if(d>1)return false;}else{i++;j++;}}return d<=1;
}
function submitAns(val){
  const qz=state.quiz;if(qz.done)return;
  const cur=qz.list[qz.i],t=qKind(cur);
  let res=null;
  if(t==='choice'||t==='tf')res=gradeTap(cur,val);
  else if(t==='fill')res=gradeFill(cur,val);
  else if(t==='order')res=gradeOrder(cur,val);
  else if(t==='essay')res=gradeEssay(cur,val);
  afterAnswer(cur,res);
}
function gradeTap(it,oi){
  const t=qKind(it);
  const ok=t==='tf'?((oi===0)===it.ans):(oi===Number(it.ans));
  const rightIdx=t==='tf'?(it.ans?0:1):Number(it.ans);
  const optEls=document.querySelectorAll('.opt');
  optEls.forEach(o=>o.classList.add('dim'));
  const fb=document.getElementById('fb');
  if(ok){
    optEls[oi].classList.add('right');
    fb.className='fb ok';fb.innerHTML='🎉 '+(PRAISE[Math.floor(Math.random()*PRAISE.length)])+'<span class="why">📝 解析：'+esc(it.why)+'</span>';
  }else{
    optEls[oi].classList.add('wrong');optEls[rightIdx].classList.add('right');
    fb.className='fb bad';fb.innerHTML='❌ 答错了<span class="why">📝 解析：'+esc(it.why)+'</span>';
  }
  return {ok:ok,got:ok?(it.pt||1):0,html:fb.innerHTML};
}
function matchFill(s,al){
  s=normAns(s);
  if(s.length<2)return false;  // 少于2个字不判（防虚词/误触）
  return al.some(a=>{
    const na=normAns(a);
    if(s===na)return true;
    // 关键词判定：孩子的答案含标准答案（或其关键词），或反之——有关键词就判对
    return (na.length>=2&&s.includes(na))||(s.length>=2&&na.includes(s));
  });
}
function gradeFill(it,arr){
  const pairs=(it.a||it.ans);
  const okAll=pairs.every((al,k)=>matchFill(arr[k],al));
  const near=pairs.some((al,k)=>!matchFill(arr[k],al)&&al.some(a=>nearMiss(arr[k],a)));
  const ansShow=pairs.map(al=>al[0]).join('、');
  const fb=document.getElementById('fb');
  if(okAll){
    fb.className='fb ok';fb.innerHTML='🎉 填空正确！<span class="why">📝 解析：'+esc(it.why)+'</span>';
  }else{
    fb.className='fb bad';
    fb.innerHTML='❌ 有空格不对<span class="why">📝 答案：'+esc(ansShow)+'｜解析：'+esc(it.why)+'</span>'
      +(near?'<button class="btn2" style="margin-top:8px" onclick="fillOverride()">我写的其实是对的（拼写小误差）</button>':'');
  }
  return {ok:okAll,got:okAll?(it.pt||1):0,html:fb.innerHTML,near:near};
}
function fillOverride(){
  const qz=state.quiz,cur=qz.list[qz.i];
  qz.work.fillOverride=true;
  afterAnswer(cur,{ok:true,got:(cur.pt||1),html:'👍 算你对！<span class="why">📝 解析：'+esc(cur.why)+'</span>',override:true});
}
function gradeOrder(it,seq){
  const qz=state.quiz,shuf=qz.work.shuf;
  const ok=seq.length===it.items.length&&seq.every((d,k)=>shuf[d]===k);
  const fb=document.getElementById('fb');
  if(ok){
    fb.className='fb ok';fb.innerHTML='🎉 顺序完全正确！<span class="why">📝 解析：'+esc(it.why)+'</span>';
  }else{
    fb.className='fb bad';fb.innerHTML='❌ 顺序有误<span class="why">📝 正确顺序：'+esc(it.items.join(' → '))+'｜解析：'+esc(it.why)+'</span>';
  }
  return {ok:ok,got:ok?(it.pt||1):0,html:fb.innerHTML};
}
function gradeEssay(it,ks){
  let got=0,full=true;
  it.subs.forEach((s,si)=>{
    const k=ks[si]||0;got+=Math.round((s.score||0)*k);
    if(k!==1)full=false;
  });
  const fb=document.getElementById('fb');
  const max=(it.subs||[]).reduce((a,s)=>a+(s.score||0),0);
  if(full){
    fb.className='fb ok';fb.innerHTML='🏆 全部要点都答到了，满分 '+max+' 分！<span class="why">📝 解析：'+esc(it.why)+'</span>';
  }else{
    fb.className='fb bad';fb.innerHTML='📝 自评得分 '+got+' / '+max+' 分<span class="why">没答全的要点要记住哦：'+esc(it.why)+'</span>';
  }
  return {ok:full,got:got,html:fb.innerHTML};
}
function afterAnswer(cur,res){
  const qz=state.quiz;
  qz.got+=res.got;
  if(res.ok){qz.score++;if(qKind(cur)!=='essay')qz.objScore++;}
  else if(!res.override)qz.wrong.push(cur);
  statsAdd(res.ok,qKind(cur)==='essay'?res.got:0);
  qz.done=true;
  const nb=document.getElementById('nextbtn');
  nb.style.display='block';
  nb.textContent=(qz.i<qz.list.length-1)?'下一题 →':'查看成绩 🏁';
}
/* ---------- 收尾 ---------- */
function nextQ(){
  const qz=state.quiz;
  if(qz.i<qz.list.length-1){qz.i++;qz.done=false;qz.work={};renderQuiz();}
  else{finishQuiz();}
}
function quitQuiz(){
  stopTimer();
  if(state.quiz&&state.quiz.mode==='wrong')state.view='wrong';
  else if(state.quiz&&state.quiz.mode==='gate')state.view='gates';
  else if(state.quiz&&state.quiz.mode==='daily')state.view='daily';
  else state.view='chapter';
  state.quiz=null;render();
}
function finishQuiz(){
  stopTimer();
  const qz=state.quiz,n=qz.list.length;
  const pct=qz.max?Math.round(qz.got/qz.max*100):0;
  const pctObj=qz.objN?Math.round(qz.objScore/qz.objN*100):0;
  if(qz.mode==='wrong'){
    const wb=lsGet('wrongbook',[]);
    const keep=qz.wrong.map(w=>keyOf(w));
    wb.forEach(w=>{if(!keep.includes(keyOf(w)))wrongRemove(w);});
  }else{
    qz.wrong.forEach(w=>wrongAdd(w));
    if(qz.mode==='chapter'&&pctObj>=60){const u=DATA.units[state.unit];setDone(u.id,u.chapters[state.ch].id,true);}
    if(qz.mode==='daily'){
      const dk='daily_'+ymd();
      const old=lsGet(dk,null);
      if(!old||pct>old.best)lsSet(dk,{best:pct,right:qz.score,total:n,ts:Date.now()});
    }
    if(qz.mode==='gate'&&pctObj>=80)gatePass(qz.gateSi,pctObj);
  }
  const st=lsGet('stats',{ans:0,right:0});
  const r=rankOf(st.right),nx=rankNext(st.right);
  const stars=pct>=90?'⭐⭐⭐':pct>=70?'⭐⭐':pct>=60?'⭐':'';
  const msg=pct>=90?'完美通关！知识全在脑子里了！':pct>=70?'掌握得不错，错题多看看！':pct>=60?'及格啦！把错题本过一遍更稳！':(TRYAGAIN[Math.floor(Math.random()*TRYAGAIN.length)]);
  const wl=qz.wrong.map((w,i)=>'<div style="padding:4px 0;border-bottom:1px dashed #f0d5d8">'+(i+1)+'. '+esc(w.q)+'</div>').join('');
  let gateNote='';
  if(qz.mode==='gate'){
    gateNote=pctObj>=80?'<div class="score-msg" style="color:#1e7a48;font-weight:700">🎉 闯关成功！下一节已解锁！</div>':('<div class="score-msg">闯关需答对80%（客观题），再来一次！</div>');
  }
  app.innerHTML='<div class="card score-box">'
    +'<div class="score-emoji">'+(pct>=90?'🏆':pct>=70?'🎉':pct>=60?'😊':'💪')+'</div>'
    +'<div class="score-num">'+qz.score+' / '+n+' 题'+(qz.mode==='daily'?' · '+pct+'分':'')+'</div>'
    +'<div class="score-stars">'+stars+'</div>'
    +'<div class="score-msg">'+msg+'　'+r.ic+' '+r.n+'段位'+(nx?' · 再对'+(nx.min-st.right)+'题升'+nx.n:'')+'</div>'
    +gateNote
    +(qz.wrong.length?'<div class="wrong-mini"><b>本次错题：</b>'+wl+'</div>':'<div class="score-msg" style="color:#1e7a48">全对！一个错题都没有！🎊</div>')
    +'<div class="btn-row"><button class="next-btn" onclick="startQuiz(\''+qz.mode+'\','+(qz.mode==='gate'?'{si:'+qz.gateSi+'}':'{}')+')">再来一遍 🔄</button>'
    +'<button class="btn2" onclick="afterQuiz()">完成 ✅</button></div></div>';
}
function afterQuiz(){
  const m=state.quiz?state.quiz.mode:'chapter';
  state.quiz=null;
  if(m==='wrong')state.view='wrong';
  else if(m==='gate')state.view='gates';
  else if(m==='daily')state.view='daily';
  else{state.view='chapter';state.tab='points';}
  render();
}
/* ---------- 错题本 ---------- */
function ansText(w){
  const t=w.t||w.type||'choice';
  if(t==='tf')return w.ans?'✔ 正确':'✘ 错误';
  if(t==='fill')return ((w.a||w.ans||[[]])[0]&&(w.a||w.ans)[0][0])||'见解析';
  if(t==='order')return w.items?w.items.join(' → '):'见解析';
  if(t==='essay')return '见要点（重做时对照）';
  if(w.opts&&w.opts[w.ans]!=null)return optText(w.opts[w.ans]);
  return '';
}
function renderWrong(){
  const wb=lsGet('wrongbook',[]);
  if(!wb.length){
    app.innerHTML='<div class="card score-box"><div class="score-emoji">🎊</div><div class="score-num" style="font-size:1.1rem">错题本是空的！</div><div class="score-msg">做题时答错的题会自动收集到这里，方便反复复习。</div><button class="next-btn" onclick="goHome()">去学习 📚</button></div>';
    return;
  }
  let h='<div class="back-row"><div class="ch-title">📕 错题本（'+wb.length+'题）</div></div>';
  h+=wb.map((w,i)=>{
    const t=w.t||w.type||'choice';
    return '<div class="wrong-item"><span class="w-tag">'+esc(w.chn||'')+' · '+(KIND[t]?KIND[t].n:'选择')+'</span>'
      +'<div class="w-q">'+(i+1)+'. '+esc(w.q||'')+'</div>'
      +'<div class="w-a">正确答案：<b>'+esc(ansText(w))+'</b></div>'
      +(w.why?'<div class="w-why">📝 '+esc(w.why)+'</div>':'')+'</div>';
  }).join('');
  h+='<div class="btn-row"><button class="next-btn" onclick="startQuiz(\'wrong\')">错题重做 🔁</button>'
    +'<button class="btn2" style="color:#c0392b;border-color:#c0392b" onclick="clearWrong()">清空错题本 🗑</button></div>';
  app.innerHTML=h;
}
function clearWrong(){if(confirm('确定清空所有错题吗？')){lsSet('wrongbook',[]);updateBadge();render();}}
/* ---------- 每日挑战 ---------- */
function renderDaily(){
  const dk='daily_'+ymd();
  const dv=lsGet(dk,null);
  let h='<div class="back-row"><button class="back-btn" onclick="goHome()">← 返回</button><div class="ch-title">⚡ 每日挑战</div></div>';
  h+='<div class="card"><div style="font-weight:800;font-size:.95rem;color:#8a5a00;margin-bottom:8px">规则</div>'
    +'<p style="font-size:.83rem;color:#54636e;line-height:1.8">①每天从全册随机抽 10 题，限时 5 分钟；②同一人当天反复进入拿到同一套题，刷的是速度不是运气；③只记当日最高分；④答对的题累计进段位。</p>'
    +(dv?'<div style="margin-top:10px;font-size:.85rem;color:#2b4a3d;font-weight:700">今日最高：'+dv.best+' 分（'+dv.right+'/'+dv.total+' 题）</div>':'')
    +'<button class="next-btn" onclick="startQuiz(\'daily\')">'+(dv?'再战今日挑战 ⚡':'开始今日挑战 ⚡')+'</button></div>';
  app.innerHTML=h;
}
/* ---------- 闯关 ---------- */
function gateKey(uid,cid){return 'gate_'+uid+'_'+cid;}
function gateState(uid,cid){return lsGet(gateKey(uid,cid),{});}
function gatePass(si,pct){
  const uid=DATA.units[state.unit].id,cid=DATA.units[state.unit].chapters[state.ch].id;
  const g=gateState(uid,cid);
  const old=g[si]||{};
  g[si]={p:1,best:Math.max(old.best||0,pct)};
  lsSet(gateKey(uid,cid),g);
}
function renderGates(){
  const u=DATA.units[state.unit],c=u.chapters[state.ch];
  const g=gateState(u.id,c.id);
  let h='<div class="back-row"><button class="back-btn" onclick="goBackChapters()">← 返回</button><div class="ch-title">🎮 闯关 · '+esc(c.name)+'</div></div>';
  h+='<div class="card"><p style="font-size:.8rem;color:#8a97a3;line-height:1.7">按节逐关挑战：本节的题答对80%以上，自动解锁下一节。全部通关你就是本章擂主！</p></div>';
  c.sections.forEach((s,si)=>{
    const sid=s.id||('s'+(si+1));
    const unlocked=(si===0)||!!g[si-1];
    const passed=!!g[si];
    h+='<div class="gate-item'+(unlocked?'':' lock')+'" '+(unlocked?'onclick="startGate('+si+')"':'')+'>'
      +'<div class="gate-no">'+(passed?'✓':(si+1))+'</div>'
      +'<div class="gate-info"><div class="gate-name">'+esc(s.name)+'</div>'
      +'<div class="gate-meta">'+(passed?('已通关 · 最高 '+g[si].best+'%'):(unlocked?'点击开始闯关':'先通过上一关'))+'</div></div>'
      +'<div class="gate-go">'+(passed?'✅':(unlocked?'挑战 ›':'🔒'))+'</div></div>';
  });
  app.innerHTML=h;
}
function startGate(si){
  state.tab='quiz';
  startQuiz('gate',{si:si});
}
/* ---------- 段位 ---------- */
function renderRank(){
  const st=lsGet('stats',{ans:0,right:0});
  const r=rankOf(st.right),nx=rankNext(st.right);
  let h='<div class="back-row"><button class="back-btn" onclick="goHome()">← 返回</button><div class="ch-title">🏆 段位称号</div></div>';
  h+='<div class="rank-card"><div class="rank-top"><div class="rank-ic">'+r.ic+'</div><div><div class="rank-name">'+r.n+'段位</div>'
    +'<div class="rank-sub">累计答对 '+st.right+' 题 · 共答题 '+st.ans+' 题</div></div></div>'
    +'<div class="rank-pbar"><i style="width:'+(nx?Math.round(st.right/Math.max(nx.min,1)*100):100)+'%"></i></div>'
    +'<div class="rank-sub" style="margin-top:6px">'+(nx?('再答对 '+(nx.min-st.right)+' 题升到 '+nx.n+' '+nx.ic):'已是最高段位！')+'</div></div>';
  RANKS.forEach(x=>{
    h+='<div class="card unit-card"><div class="unit-emoji" style="font-size:1.5rem">'+x.ic+'</div>'
      +'<div class="unit-info"><div class="unit-name">'+x.n+(x===r?'（当前）':'')+'</div>'
      +'<div class="unit-meta">累计答对 '+x.min+' 题'+(x===RANKS[0]?'以上':'解锁')+'</div></div></div>';
  });
  app.innerHTML=h;
}
/* ---------- 口诀卡 ---------- */
function renderMnemo(){
  let h='<div class="back-row"><button class="back-btn" onclick="goHome()">← 返回</button><div class="ch-title">🧠 记忆口诀卡</div></div>';
  let n=0;
  DATA.units.forEach(u=>{
    u.chapters.forEach(c=>{
      const items=[];
      c.sections.forEach(s=>{if(s.mn)items.push({t:s.name,mn:s.mn});s.points.forEach(p=>{if(p.mn)items.push({t:p.t,mn:p.mn});});});
      c.keypoints.forEach(k=>{if(k.mn)items.push({t:k.t,mn:k.mn});});
      if(items.length){
        h+='<h2 class="sec">'+u.emoji+' '+esc(c.name)+'</h2>';
        items.forEach(it=>{n++;h+='<div class="mn-card"><div class="mn-t">'+esc(it.t)+'</div><div class="mn-m">'+esc(it.mn)+'</div></div>';});
      }
    });
  });
  if(!n)h+='<div class="card score-box"><div class="score-emoji">🧠</div><div class="score-msg">口诀还在收集中，先去看看知识点吧！</div></div>';
  app.innerHTML=h;
}
/* ---------- 关于 ---------- */
function renderAbout(){
  app.innerHTML='<div class="card about">'
    +'<h3>📕 关于本复习助手</h3>'
    +'<p>内容依据 <b>湘教版（湖南教育出版社）义务教育教科书·地理七年级上册（2024秋版）</b> 整理，适用于江苏徐州初一学生。</p>'
    +'<h3>🧭 怎么用</h3>'
    +'<p>①按单元逐章学习“知识点”，重点看🔑标记和“重点”页；②考前重点过“易错点”页，考试避坑；③学完做“练习”，答对率60%以上自动标记已掌握；④错题自动进错题本，反复重做到全会为止。</p>'
    +'<h3>🎮 趣味玩法</h3>'
    +'<p>⚡每日挑战：每天10题限时赛；🏆段位称号：答题升级青铜→白银→黄金→王者；🎮闯关模式：按节逐关解锁；🧠记忆口诀卡：顺口溜背得快。</p>'
    +'<h3>📱 离线使用</h3>'
    +'<p>本文件是单文件网页，不需要联网。发送到手机后用浏览器打开即可；建议收藏到浏览器书签或添加到桌面。</p>'
    +'<h3>⚠️ 说明</h3>'
    +'<p>内容依据教材整理，供复习参考；具体考点范围请以学校老师要求为准。发现内容有误可直接告诉我修改。</p>'
    +'</div>';
}
document.getElementById('nav').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  const v=b.dataset.v;
  if(v==='home')state.view='home';
  else if(v==='wrong')state.view='wrong';
  else if(v==='about')state.view='about';
  stopTimer();state.quiz=null;render();
});
render();
</script>
