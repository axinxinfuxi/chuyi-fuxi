{"name":"第1节 生物生存依赖一定的环境","points":[
{"t":"什么是生态因素？","d":"环境中影响生物生活和分布的因素叫做生态因素，分为两类：①非生物因素：光、温度、水、空气、土壤等；②生物因素：影响该生物生活的其他生物。"},
{"t":"非生物因素——光","d":"光影响植物的分布（背阴处长苔藓）、影响动物行为（鼠妇怕光喜阴、猫头鹰夜行）。深海中植物少，因为光照不足。"},
{"t":"非生物因素——温度","d":"大雁南飞（秋冬温度降低）、蛇和青蛙冬眠、北极狐和沙漠狐体型差异，都受温度影响。"},
{"t":"非生物因素——水","d":"仙人掌叶退化成刺、骆驼耐旱，是为了适应缺水的环境；干旱地区的植物根系发达。"},
{"t":"非生物因素——空气","d":"空气成分（氧气、二氧化碳）影响生物。鱼离开水会死，因为水中有溶解的氧，鱼靠鳃呼吸。"},
{"t":"生物因素的五种关系","d":"①捕食：狼捕羊；②竞争：同一草原上的牛和羊争夺牧草；③寄生：蛔虫寄生在人体内；④共生：豆科植物和根瘤菌（互相有利）；⑤合作：蚂蚁合作搬食物。"},
{"t":"“人间四月芳菲尽，山寺桃花始盛开”","d":"这句诗说明山上和山下的气温不同，桃花开放时间不同——影响桃花开花的生态因素是温度。"}
]},
{"name":"第2节 生物对环境的适应和影响","points":[
{"t":"生物对环境的适应","d":"适应具有普遍性，如：①保护色：北极熊白色、变色龙变色（与环境颜色相似）；②拟态：竹节虫像树枝、枯叶蝶像枯叶；③警戒色：毒蛇鲜艳的花纹警告天敌。还有行为适应：候鸟迁徙、动物冬眠。"},
{"t":"适应具有相对性","d":"适应不是绝对的、永久的。例如雷鸟冬天换白羽与雪地一致，但如果雪提前融化，白羽反而容易被天敌发现——适应是相对的。"},
{"t":"生物对环境的影响","d":"生物不仅能适应环境，还能影响和改变环境：蚯蚓疏松土壤、植物蒸腾作用增加空气湿度（“大树底下好乘凉”）、植物防风固沙、净化空气。"},
{"t":"环境与生物的关系总结（三个方向）","d":"①环境影响生物（水分影响仙人掌形态）；②生物适应环境（仙人掌叶刺适应干旱）；③生物影响环境（蚯蚓松土）。判断时先看主语是谁、干了什么。"}
]},
{"name":"跨学科实践活动","points":[
{"t":"校园/小区里的生物与环境调查","d":"用调查法观察记录：哪些生物适应了哪些环境（墙角苔藓爱阴湿）、哪些生物影响了环境（树荫下更凉快）。调查报告 = 调查法的实践。"}
]}
],"keypoints":[
{"t":"生态因素的分类","d":"拿到一个例子先判断是“非生物因素”（光、温度、水、空气）还是“生物因素”（捕食、竞争、寄生、共生、合作）。例如“大树底下好乘凉”是生物影响环境，不是生态因素影响生物。"},
{"t":"适应、影响、环境影响的辨析","d":"这是最常考的三选一：“骆驼刺根系发达”是适应；“蚯蚓疏松土壤”是影响；“干旱使植物矮小”是环境影响生物。"},
{"t":"保护色、拟态、警戒色","d":"保护色=颜色和环境融为一体；拟态=模仿成别的东西（树枝、枯叶）；警戒色=故意鲜艳显眼警告敌人。竹节虫（拟态）、北极熊（保护色）、毒蛇（警戒色）。"}
],
"traps":[
{"w":"“山寺桃花始盛开”说明光照影响桃花开放","r":"山上温度低，所以桃花开得晚。影响桃花开放的非生物因素是温度，不是光。"},
{"w":"蚯蚓疏松土壤，说明蚯蚓“适应”土壤环境","r":"蚯蚓疏松土壤是改变了土壤，属于生物影响环境；适应是生物自身为了生存作出的改变（如蚯蚓体表湿润适于土壤生活）。"},
{"w":"竹节虫像树枝是“保护色”","r":"竹节虫模仿的是树枝的形态，属于拟态。保护色是身体颜色与环境颜色相似（如北极熊、变色龙）。"},
{"w":"雷鸟换羽说明适应是万能的","r":"适应具有相对性。环境一旦突然改变（雪提前融化），原来的适应反而变成劣势。"},
{"w":"根瘤菌和豆科植物是寄生关系","r":"根瘤菌为豆科植物提供含氮物质，豆科植物为根瘤菌提供营养，双方都有利，是共生关系。寄生是一方得利一方受害（如蛔虫）。"},
{"w":"同片草原上的牛和羊是捕食关系","r":"牛和羊都吃草，争夺同样的食物，是竞争关系。捕食是一方吃掉另一方。"},
{"w":"仙人掌的叶退化成刺是为了“好看”","r":"叶退化成刺能减少水分蒸发，是对干旱环境的适应。适应的目的是更好地生存和繁殖。"}
],
"story":{"title":"伪装大师的生存课堂","text":[
"在马来西亚的热带雨林里，有一种昆虫叫叶尾壁虎，它趴在落叶上，连纹路都和枯叶一模一样，天敌从它头顶飞过都发现不了。竹节虫更厉害，白天挂在小树枝上一动不动，风一吹，它也跟着轻轻摇晃——就像一根真正的树枝。",
"它们为什么能活到今天？因为“天敌发现不了的活下来，发现得了的被吃掉”，一代代选择下来，伪装得最像的活了下来。这就是适应。",
"但伪装大师也有失手的时候：如果一阵大风把竹节虫吹到光秃秃的地面上，它那根“树枝”就格外显眼，很快就会成为鸟的美餐。所以——适应是相对的，没有万能的伪装。"
],"tip":"保护色（与环境同色）、拟态（模仿成其他物体）、警戒色（鲜艳警告）的区别是必考点。适应具有普遍性和相对性，环境变了，适应就可能失效。"},
"quiz":[
{"q":"“人间四月芳菲尽，山寺桃花始盛开”，影响山上桃花开放的主要生态因素是（　）","opts":["A. 光照","B. 温度","C. 水分","D. 空气"],"ans":1,"why":"山上气温比山下低，所以桃花开得晚。温度是影响桃花开放的主要非生物因素。"},
{"q":"蚯蚓在土壤里活动，使土壤疏松，这说明（　）","opts":["A. 生物影响环境","B. 生物适应环境","C. 环境影响生物","D. 生物依赖环境"],"ans":0,"why":"蚯蚓的活动改变了土壤结构，是生物影响环境。"},
{"q":"竹节虫的身体与竹枝极为相似，这属于（　）","opts":["A. 保护色","B. 警戒色","C. 拟态","D. 应激性"],"ans":2,"why":"竹节虫模仿竹枝的形态，是拟态。保护色是颜色与环境相似，警戒色是鲜艳警告。"},
{"q":"下列属于生物因素对生物影响的是（　）","opts":["A. 春兰秋菊","B. 雨露滋润禾苗壮","C. 草盛豆苗稀","D. 秋风扫落叶"],"ans":2,"why":"“草盛豆苗稀”是草和豆苗争夺营养，属于生物因素（竞争）。其他三项是非生物因素。"},
{"q":"北极狐和沙漠狐体型、耳朵差别很大，起主要作用的非生物因素是（　）","opts":["A. 温度","B. 水","C. 光","D. 空气"],"ans":0,"why":"北极狐体型大、耳朵小有利于保温；沙漠狐体型小、耳朵大有利于散热，都与温度（寒冷/炎热）有关。"},
{"q":"雷鸟冬天换上白色羽毛，但如果没下雪，白色的雷鸟反而容易被发现。这说明（　）","opts":["A. 适应是相对的","B. 适应是绝对的","C. 雷鸟不会适应","D. 环境无法改变生物"],"ans":0,"why":"环境一旦改变（雪提前融化），原来的适应反而变成劣势，说明生物的适应是相对的。"},
{"q":"豆科植物与根瘤菌之间的关系是（　）","opts":["A. 捕食","B. 竞争","C. 寄生","D. 共生"],"ans":3,"why":"豆科植物为根瘤菌提供营养，根瘤菌为植物提供含氮物质，双方互惠互利，是共生。"},
{"q":"鼠妇（潮虫）喜欢生活在阴暗潮湿的地方，影响它分布的主要生态因素是（　）","opts":["A. 光和湿度","B. 温度","C. 空气","D. 土壤"],"ans":0,"why":"鼠妇怕光、需要潮湿环境，光和湿度（水分）是影响它分布的主要非生物因素。"},
{"q":"“大树底下好乘凉”主要说明（　）","opts":["A. 环境影响生物","B. 生物适应环境","C. 生物影响环境","D. 大树会发光"],"ans":2,"why":"树的蒸腾作用增加空气湿度、树荫降低温度，是大树改变了周围环境——生物影响环境。"},
{"q":"下列各项中，属于生物适应环境的是（　）","opts":["A. 千里之堤，溃于蚁穴","B. 仙人掌的叶退化成刺","C. 蚯蚓疏松土壤","D. 大树底下好乘凉"],"ans":1,"why":"仙人掌叶变成刺，减少水分蒸发，是对干旱环境的适应。A、C、D都是生物影响环境。"}
]},
{"id":"c3s1","name":"第3章 生态系统和生物圈","emoji":"🌳","sections":[
{"name":"第1节 多种多样的生态系统","points":[
{"t":"什么是生态系统？","d":"在一定区域内，生物与环境所形成的统一整体。一片森林、一个池塘、一块农田、一个校园，都是生态系统。"},
{"t":"生态系统的组成（两大部分）","d":"①非生物部分：阳光、温度、水、空气、土壤等；②生物部分：生产者、消费者、分解者。"},
{"t":"生产者","d":"主要指绿色植物。能通过光合作用把无机物制造成有机物，是生态系统中最基本、最关键的生物成分。"},
{"t":"消费者","d":"各种动物。不能自己制造有机物，直接或间接以植物为食（草食动物、肉食动物）。"},
{"t":"分解者","d":"主要是细菌、真菌等微生物。把动植物遗体、粪便中的有机物分解成无机物，供植物重新利用，促进物质循环。"},
{"t":"判断是不是生态系统","d":"完整的生态系统=生物部分+非生物部分。“池塘里的所有鱼”只有部分生物，不是生态系统；“一片森林”是生态系统。"},
{"t":"多种多样的生态系统","d":"森林生态系统、草原生态系统、农田生态系统、湿地生态系统、海洋生态系统、城市生态系统等。"},
{"t":"生物圈","d":"地球上所有生物与其环境的总和，范围包括大气圈的底部、水圈的大部和岩石圈的表面。生物圈是最大的生态系统，是所有生物共同的家园。"}
]},
{"name":"第2节 生态系统中不同生物之间的食物关系","points":[
{"t":"食物链","d":"生态系统中，不同生物之间由于吃与被吃的食物关系形成的链状结构。例如：草→兔→鹰。"},
{"t":"书写食物链的三条铁律","d":"①起点必须是生产者（绿色植物）；②箭头指向捕食者，表示物质和能量流动的方向；③只写生产者和消费者，不写分解者和非生物成分。"},
{"t":"食物网","d":"生态系统中多条食物链相互交错，形成食物网。食物网越复杂，生态系统越稳定。"},
{"t":"能量流动","d":"能量沿食物链单向流动、逐级递减。生物通过呼吸作用消耗一部分能量，能量不能循环利用。"},
{"t":"物质循环","d":"生态系统中的物质（如碳、水等）可以被循环利用。"},
{"t":"生物富集","d":"有毒物质（如DDT、重金属）沿食物链不断积累，营养级越高，体内有毒物质浓度越大。"},
{"t":"角色判断","d":"在“草→兔→鹰”中：草是生产者，兔是初级消费者（草食动物），鹰是次级消费者。"}
]},
{"name":"第3节 维护生态系统的稳定","points":[
{"t":"生态系统的稳定性","d":"生态系统具有一定的自我调节能力。生物种类越多、结构越复杂，自我调节能力越强（森林＞农田）。"},
{"t":"自我调节能力是有限的","d":"破坏超过一定限度，生态系统就会失衡甚至崩溃。"},
{"t":"破坏生态平衡的行为","d":"①外来物种入侵（澳大利亚野兔、水葫芦）；②过度放牧、乱砍滥伐；③环境污染；④乱捕滥猎。"},
{"t":"维护生态稳定的措施","d":"建立自然保护区、退耕还林还草、植树造林、生物防治、控制污染。"},
{"t":"徐州身边的事","d":"贾汪区潘安湖曾是采煤塌陷区，经过生态修复成为国家级湿地公园，是“绿水青山就是金山银山”的生动实践。"}
]},
{"name":"跨学科实践活动","points":[
{"t":"设计并制作生态瓶","d":"生态瓶是一个密封的微型生态系统，瓶中要有：生产者（水草）、消费者（小鱼小虾）、分解者（泥沙中的微生物）和非生物部分（水、阳光、空气）。动植物数量要合适，放在有光照但不过热的地方。"}
]}
],
"keypoints":[
{"t":"生态系统组成辨析","d":"“下列属于生态系统的是”必考。只含生物（所有鱼、所有植物）的不是生态系统；既有生物又有环境的才是。非生物部分也是生态系统的组成部分。"},
{"t":"食物链书写","d":"三条铁律常组合考查。典型错误：阳光→草→兔（起点错）；草→兔→细菌（分解者不能进食物链）；草←兔（箭头反）。"},
{"t":"能量递减 vs 生物富集","d":"沿食物链：能量越来越少（逐级递减）；有毒物质越来越多（富集递增）。两个方向相反，别记混。"},
{"t":"自我调节能力","d":"有限度！外来物种入侵破坏生态的机理：新环境缺少天敌→大量繁殖→破坏原有食物链和生态平衡。"}
],
"traps":[
{"w":"阳光→草→兔→鹰是一条正确的食物链","r":"食物链起点必须是生产者，阳光是非生物因素，不能写进食物链。正确写法：草→兔→鹰。"},
{"w":"食物链里要写上细菌真菌等分解者","r":"食物链只写生产者和消费者。分解者参与物质循环，但不写入食物链。"},
{"w":"草→兔的箭头表示草吃兔","r":"箭头指向捕食者，草→兔表示“兔吃草”，也表示能量从草流向兔。"},
{"w":"有毒物质沿食物链越来越少","r":"有毒物质沿食物链不断富集，营养级越高的生物体内积累得越多。鹰体内DDT浓度远高于草。"},
{"w":"能量可以在食物链中循环利用","r":"能量单向流动、逐级递减，不能循环。能循环利用的是物质（如水、碳）。"},
{"w":"生态系统的自我调节能力无限大","r":"自我调节能力是有限的。外来物种入侵、污染超限都会导致生态失衡。"},
{"w":"池塘里的所有鱼是一个生态系统","r":"所有鱼只是部分生物，缺少其他生物和非生物部分。整个池塘（含全部生物和水、阳光等）才是生态系统。"},
{"w":"细菌真菌都是分解者","r":"营腐生生活的细菌真菌是分解者；寄生的细菌（如致病菌）属于消费者。要看生活方式。"}
],
"story":{"title":"24只兔子“吃掉”一个大陆","text":[
"1859年，一个英国人把24只兔子带到了澳大利亚。这里气候适宜、水草丰美，最重要的是——没有狼、狐狸这些天敌。兔子疯狂繁殖，几十年后竟然达到了数亿只！",
"它们啃光草场、和牛羊抢食，破坏大片农田和植被，把当地的生态系统搅得天翻地覆。人们建围栏、放病毒、悬赏捕猎，打了一百多年的“兔子战争”，至今还在继续。",
"这个故事告诉我们：生态系统的自我调节能力是有限的。外来物种一旦失去天敌的制约，原有的食物链和生态平衡就会被破坏。",
"咱徐州也有一个了不起的例子：贾汪区的潘安湖，过去是煤矿采煤塌陷区，坑坑洼洼、煤灰飞扬。经过生态修复，变成了碧波荡漾的国家级湿地公园，白鹭都飞回来了。",
"破坏生态很容易，修复它却需要很多年的努力。维护生态系统的稳定，是每个人的事。"
],"tip":"外来物种入侵是“破坏生态平衡”的经典考例；自我调节能力有限；食物链书写三铁律；能量递减、有毒物质富集递增。"},
"quiz":[
{"q":"下列属于生态系统的是（　）","opts":["A. 池塘中所有的鱼","B. 一片森林","C. 森林里所有的植物","D. 草原上的兔子"],"ans":1,"why":"生态系统=生物+环境形成的统一整体。A、C、D都只有生物的一部分，缺少环境和其他生物。"},

{"q":"分解者在生态系统中的作用是（　）","opts":["A. 制造有机物","B. 把有机物分解成无机物","C. 捕食动物","D. 提供阳光"],"ans":1,"why":"分解者把动植物遗体中的有机物分解成无机物，供植物重新利用，促进物质循环。"},
{"q":"下列食物链书写正确的是（　）","opts":["A. 阳光→草→兔","B. 草→兔→鹰","C. 兔→草→鹰","D. 草←兔←鹰"],"ans":1,"why":"起点是生产者（草），箭头指向捕食者。A起点错，C顺序反，D箭头方向反。"},
{"q":"食物链中箭头表示（　）","opts":["A. 捕食关系和能量流动方向","B. 只是好看","C. 物质循环方向","D. 谁被谁吃相反方向"],"ans":0,"why":"箭头指向捕食者，表示能量从被捕食者流向捕食者。"},
{"q":"能量沿食物链流动的特点是（　）","opts":["A. 循环利用","B. 单向流动、逐级递减","C. 越流越多","D. 保持不变"],"ans":1,"why":"能量单向流动，每一级生物呼吸都要消耗能量，所以逐级递减，不能循环。"},
{"q":"草→鼠→蛇→鹰中，体内有毒物质积累最多的是（　）","opts":["A. 草","B. 鼠","C. 蛇","D. 鹰"],"ans":3,"why":"有毒物质沿食物链富集，营养级越高积累越多。鹰处于最高营养级，体内有毒物质最多。"},
{"q":"地球上最大的生态系统是（　）","opts":["A. 海洋生态系统","B. 森林生态系统","C. 生物圈","D. 草原生态系统"],"ans":2,"why":"生物圈是地球上所有生物与其环境的总和，是最大的生态系统。"},
{"q":"生态系统的自我调节能力（　）","opts":["A. 是无限的","B. 有一定限度","C. 不存在","D. 只有森林才有"],"ans":1,"why":"生态系统具有一定的自我调节能力，但能力有限，破坏超限就会失衡。"},
{"q":"水葫芦疯长覆盖水面导致鱼类大量死亡，主要原因是（　）","opts":["A. 水葫芦有毒","B. 外来物种入侵破坏生态平衡","C. 鱼类不爱吃水葫芦","D. 水温升高"],"ans":1,"why":"水葫芦是外来物种，新环境缺少天敌大量繁殖，破坏原有生态平衡。"},
{"q":"密封良好的生态瓶中，扮演生产者角色的是（　）","opts":["A. 水草","B. 小鱼","C. 小虾","D. 泥沙"],"ans":0,"why":"水草能进行光合作用制造有机物，是生态瓶中的生产者。"},
{"q":"营腐生生活的细菌在生态系统中属于（　）","opts":["A. 生产者","B. 消费者","C. 分解者","D. 非生物成分"],"ans":2,"why":"腐生细菌分解动植物遗体中的有机物，属于分解者。"},
{"q":"草→兔→狼这条食物链中，兔属于（　）","opts":["A. 生产者","B. 初级消费者","C. 次级消费者","D. 分解者"],"ans":1,"why":"兔吃草，是直接以植物为食的草食动物，属于初级消费者。"},
{"q":"生态系统中能循环利用的是（　）","opts":["A. 能量","B. 物质","C. 光","D. 热量"],"ans":1,"why":"物质可以被循环利用；能量单向流动、逐级递减，不能循环。"},

]}

{"id":"u3","name":"第3单元 生物体的结构层次","emoji":"🧫","chapters":[
{"id":"c4s1","name":"第4章 生物体有相同的基本结构","emoji":"🔍","sections":[
{"name":"第1节 细胞是生物体结构和功能的基本单位","points":[
{"t":"显微镜的结构","d":"目镜、物镜（放大作用）；转换器（更换物镜）；反光镜和遮光器（调节光线）；粗准焦螺旋、细准焦螺旋（调节焦距）。"},
{"t":"放大倍数","d":"显微镜放大倍数=目镜放大倍数×物镜放大倍数（相乘，不是相加）。目镜10×、物镜40×，放大400倍。"},
{"t":"显微镜的使用步骤","d":"①取镜安放；②对光（低倍物镜对准通光孔→转动反光镜→看到明亮视野）；③放置装片；④调焦观察（先粗后细）；⑤收镜。"},
{"t":"成像特点","d":"显微镜成的是倒像——上下颠倒、左右相反。物像偏哪里，装片就往哪里移（物像在左上方，要移到中央，装片向左上方移动）。"},
{"t":"低倍镜换高倍镜","d":"细胞变大、数目变少、视野变暗（光线变弱）。"},
{"t":"制作洋葱鳞片叶内表皮细胞临时装片","d":"擦→滴（清水）→撕（内表皮）→展（展平）→盖（盖玻片）→染（碘液）→吸。滴清水是为了保持细胞的正常形态。"},
{"t":"制作人口腔上皮细胞临时装片","d":"滴的是生理盐水（0.9%），作用是维持细胞正常形态；取材前要用凉开水漱口。步骤：擦→滴→刮→涂→盖→染→吸。"},
{"t":"盖盖玻片的方法","d":"用镊子夹住盖玻片，让一侧先接触水滴，再缓缓放下。目的是避免产生气泡。"},
{"t":"染色","d":"用碘液染色，细胞核被染得最深，便于观察。"},
{"t":"植物细胞的结构","d":"细胞壁、细胞膜、细胞质、细胞核、液泡、叶绿体、线粒体。"},
{"t":"动物细胞的结构","d":"细胞膜、细胞质、细胞核、线粒体。"},
{"t":"动植物细胞的异同","d":"共有：细胞膜、细胞质、细胞核、线粒体。植物细胞特有：细胞壁、液泡、叶绿体。"},
{"t":"细胞各结构的功能","d":"细胞壁——支持保护；细胞膜——控制物质进出；细胞质——生命活动的主要场所；细胞核——含遗传物质，是生命活动的控制中心；线粒体——呼吸作用场所，为生命活动提供能量（“动力车间”）；叶绿体——光合作用场所；液泡——内有细胞液，含糖分、色素等物质。"},
{"t":"重要细节","d":"洋葱鳞片叶内表皮细胞没有叶绿体！叶绿体只存在于植物的绿色部分细胞中。"},
{"t":"细胞学说","d":"德国科学家施莱登和施旺提出：一切动植物都是由细胞构成的，细胞是生物体结构和功能的基本单位。"}
]},
{"name":"跨学科实践活动","points":[
{"t":"制作细胞的结构模型","d":"用黏土、橡皮泥等材料制作植物细胞或动物细胞模型：用不同颜色代表不同结构，标出细胞壁、细胞膜、细胞核、液泡等名称。做模型能帮助记住各结构的位置和大小关系。"}
]},
{"name":"第2节 单细胞生物","points":[
{"t":"什么是单细胞生物","d":"身体只由一个细胞构成的生物，能独立完成营养、呼吸、运动、排泄、生殖等各项生命活动。"},
{"t":"常见的单细胞生物","d":"草履虫、变形虫、衣藻、眼虫、酵母菌、细菌等。"},
{"t":"草履虫的结构与功能","d":"纤毛——运动；表膜——呼吸（气体交换）；口沟——取食；食物泡——消化食物；胞肛——排出食物残渣；伸缩泡和收集管——收集并排出多余水分和代谢废物；细胞核——控制生命活动。"},
{"t":"草履虫的应激性","d":"趋向有利刺激（如肉汁），避开有害刺激（如盐水）。这是生物对外界刺激作出反应的表现。"},
{"t":"单细胞生物与人类的关系","d":"有利：酵母菌可酿酒、发面，草履虫等能净化污水；有害：疟原虫使人患疟疾，某些藻类大量繁殖引起赤潮。"}
]}
],
"keypoints":[
{"t":"显微镜成像与移动","d":"“物像偏哪，装片往哪移”是高频考点。因为成像是倒像：物像在左上方，说明实际标本在右下方，所以装片要向左上方移动。"},
{"t":"两种装片的液体","d":"洋葱表皮滴清水（植物细胞有细胞壁，吸水不胀破）；口腔上皮滴生理盐水（维持细胞正常形态）。口诀：植物清水，动物盐水。"},
{"t":"动植物细胞异同","d":"共有四种结构（膜、质、核、线粒体）；植物特有三种（壁、液泡、叶绿体）。注意“洋葱表皮无叶绿体”是专门挖的坑。"},
{"t":"草履虫结构与功能对应","d":"几乎每考必有一题。记住：胞肛排食物残渣、伸缩泡排水、表膜呼吸、纤毛运动。"}
],
"traps":[

{"w":"口腔上皮细胞装片也滴清水","r":"滴生理盐水（0.9%），维持细胞正常形态。滴清水动物细胞会吸水胀破。"},

{"w":"细胞核没什么用，细胞质才重要","r":"细胞核内含有遗传物质，控制着生物的遗传和发育，是生命活动的控制中心。"},
{"w":"草履虫的食物残渣从伸缩泡排出","r":"食物残渣从胞肛排出；伸缩泡和收集管排出的是多余的水分和代谢废物。"},
{"w":"草履虫用口沟呼吸","r":"草履虫靠表膜进行呼吸（气体交换），口沟是取食结构。"},

],
"story":{"title":"列文虎克在牙垢里发现了“小人国”","text":[
"1674年，荷兰有个开布店的列文虎克，最大的爱好是磨镜片。他把镜片磨成一个个小珠子，装进自制的“显微镜”里，能把东西放大两三百倍。",
"有一天，他把一滴雨水放到镜片下——天哪！水里居然有无数游来游去的小东西！他把它们叫做“微小动物”。他又刮了点自己的牙垢观察，里面也是密密麻麻的小生物，他给朋友写信说：“我嘴里的微生物，比全荷兰的人加起来还多！”",
"列文虎克因此成了第一个发现微生物世界的人。而早在1665年，英国科学家胡克用显微镜观察软木塞薄片时，看到一个个像小房间一样的结构，就给它起名叫“cell”（小室），翻译成中文就是“细胞”。",
"从胡克看到第一个“细胞”开始，人类才慢慢知道：原来所有生物的身体，都是由这些小小的细胞构成的。"
],"tip":"细胞是生物体结构和功能的基本单位（细胞学说）；显微镜的使用与成像；草履虫是单细胞生物的典型代表。"},

{"q":"草履虫排出食物残渣的结构是（　）","opts":["A. 胞肛","B. 伸缩泡","C. 表膜","D. 口沟"],"ans":0,"why":"食物残渣从胞肛排出；伸缩泡排出的是多余水分和代谢废物。"},
{"q":"草履虫进行呼吸（气体交换）的结构是（　）","opts":["A. 口沟","B. 表膜","C. 胞肛","D. 食物泡"],"ans":1,"why":"草履虫靠表膜与外界进行气体交换（呼吸）。"},
{"q":"提出“一切动植物都是由细胞构成的”的科学家是（　）","opts":["A. 巴斯德","B. 林奈","C. 施莱登和施旺","D. 列文虎克"],"ans":2,"why":"德国科学家施莱登和施旺共同创立了细胞学说。"}

{"id":"c5s1","name":"第5章 生物体有相似的结构层次","emoji":"🧩","sections":[
{"name":"第1节 细胞的分裂与分化","points":[
{"t":"生物体生长的两个原因","d":"细胞生长（体积增大）＋细胞分裂（数目增多）。"},
{"t":"细胞分裂的过程","d":"细胞核先一分为二→细胞质分成两份→植物细胞在中央形成新的细胞膜和细胞壁，动物细胞细胞膜向内凹陷缢裂，形成两个新细胞。"},
{"t":"染色体的变化","d":"分裂时染色体先复制加倍，再平均分配到两个新细胞中。分裂后每个新细胞的染色体数目与原细胞相同。"},
{"t":"细胞分裂的结果","d":"细胞数目增多。"},
{"t":"细胞分化","d":"细胞在生长过程中，形态、结构和功能上发生变化，形成不同的细胞群，叫做细胞分化。"},
{"t":"分化的结果","d":"形成不同的组织。分化后细胞内的遗传物质没有改变。"},
{"t":"分裂与分化的区别","d":"分裂——数目增多（由一个变多个）；分化——种类增多（由一样变多样）。"}
]},
{"name":"第2节 多细胞生物的结构层次","points":[
{"t":"组织","d":"形态相似、结构和功能相同的细胞联合在一起形成的细胞群。"},
{"t":"植物的主要组织","d":"分生组织（根尖、茎尖、芽——不断分裂产生新细胞）；保护组织（表皮——保护）；营养组织（储存营养、进行光合作用）；输导组织（导管运输水分和无机盐，筛管运输有机物）；机械组织（支持作用）。"},
{"t":"动物的主要组织","d":"上皮组织（保护、分泌）；肌肉组织（收缩舒张）；神经组织（产生并传导兴奋）；结缔组织（支持、连接、保护、营养——血液、骨都属于结缔组织）。"},
{"t":"器官","d":"不同的组织按照一定的次序联合起来，形成具有一定功能的结构。如植物的根、茎、叶、花、果实、种子；动物的心脏、胃、皮肤。"},
{"t":"系统","d":"能够共同完成一种或几种生理功能的多个器官，按照一定次序组合在一起构成系统。人体有消化、呼吸、循环、泌尿、神经、运动、生殖、内分泌等系统。"},
{"t":"植物体的结构层次","d":"细胞→组织→器官→植物体（植物没有系统层次）。"},
{"t":"动物（人体）的结构层次","d":"细胞→组织→器官→系统→人体。"}
]}
],
"keypoints":[
{"t":"分裂与分化的区分","d":"一句话：分裂让细胞“变多”，分化让细胞“变不同”。分裂时染色体先复制再均分，所以数目不变；分化不改变遗传物质。"},
{"t":"动植物结构层次对比","d":"植物：细胞→组织→器官→植物体（无系统）；动物：细胞→组织→器官→系统→动物体（多“系统”一级）。常考“植物体没有哪一级”。"},
{"t":"实例判断","d":"皮肤=器官（由上皮组织＋结缔组织等多种组织构成）；血液=结缔组织；心脏=器官；橘子皮=保护组织、果肉=营养组织、整个橘子=果实（器官）。"},
{"t":"输导组织","d":"导管运输水分和无机盐（自下而上），筛管运输有机物。口诀：水走导管，料走筛管。"}
],
"traps":[
{"w":"细胞分裂时细胞质先分裂","r":"细胞分裂时细胞核先一分为二，然后细胞质再分成两份。"},
{"w":"细胞分裂后染色体数目减少一半","r":"分裂前染色体先复制加倍，再平均分配，所以新细胞的染色体数目与原细胞相同。"},
{"w":"细胞分化后遗传物质改变了","r":"分化只是形态、结构和功能改变，遗传物质没有改变。"},
{"w":"血液是液态的，所以不是组织","r":"血液属于结缔组织，是能流动的组织。"},
{"w":"皮肤是一种组织","r":"皮肤由上皮组织、结缔组织等多种组织构成，是器官。表皮才是上皮组织。"},
{"w":"植物也有系统这个结构层次","r":"植物体没有系统，最高层次是植物体。动物（人）才有系统。"},
{"w":"橘子剥下的白丝（橘络）是营养组织","r":"橘络是输导组织；橘子皮是保护组织；果肉（橘瓣）是营养组织；整个橘子是果实，属于器官。"},
{"w":"心脏就是一块肌肉组织","r":"心脏主要由肌肉组织构成，还有结缔组织、上皮组织、神经组织等，是器官。心肌才是肌肉组织。"}
],
"story":{"title":"一只蝌蚪的“变形记”","text":[
"春天，池塘里的小蝌蚪拖着长尾巴游来游去。你能想到吗？它和呱呱叫的大青蛙，其实是同一个生命。",
"青蛙的一生从一颗受精卵开始。一个细胞分裂成两个、四个……细胞越来越多（这是细胞分裂）；接着，有的细胞变成皮肤，有的变成肌肉，有的变成神经（这是细胞分化）；再组合成组织、器官、系统，最后长成一只完整的青蛙。",
"你的身体也一样：60万亿个细胞，全都来自妈妈肚子里那颗小小的受精卵。更神奇的是，每个细胞里的“设计图纸”——遗传物质，都和最初那颗受精卵一模一样。",
"所以细胞分化只是“分工不同”，并没有改变图纸。这也是为什么科学家能用一粒细胞的遗传物质培育出完整的植物、甚至克隆出小羊。"
],"tip":"细胞分裂（数目增多）与细胞分化（形成组织）的区别；分化不改变遗传物质；动植物结构层次对比是必考点。"},

{"q":"血液属于（　）","opts":["A. 上皮组织","B. 肌肉组织","C. 神经组织","D. 结缔组织"],"ans":3,"why":"血液由血浆和血细胞构成，属于结缔组织，是能流动的组织。"},

<script>
'use strict';
const DATA = JSON.parse(document.getElementById('DATA').textContent);
const app = document.getElementById('app');
function lsGet(k,f){try{const v=localStorage.getItem('biosw_'+k);return v==null?f:JSON.parse(v);}catch(e){return f;}}
function lsSet(k,v){try{localStorage.setItem('biosw_'+k,JSON.stringify(v));}catch(e){}}
const state={view:'home',unit:0,ch:0,quiz:null};
const PRAISE=['太棒了！🎉','厉害！👏','满分选手就是你！🏆','继续保持！💪','真不错！⭐','完全正确！🎯','好样的！🚀'];
const TRYAGAIN=['没关系，记下解析，再练一遍就会了！💪','别灰心，错题已进错题本，下次一定行！📕','进步都是从错题开始的！🌱'];
function navActive(){
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.v===state.view));
}
function updateBadge(){
  const wb=lsGet('wrongbook',[]);
  const b=document.getElementById('wbadge');
  b.textContent=wb.length||'';b.style.display=wb.length?'inline-block':'none';
}
function allChapters(){const r=[];DATA.units.forEach((u,ui)=>u.chapters.forEach((c,ci)=>r.push({u:ui,c:ci,ch:c})));return r;}
function chapterDone(uid,cid){return !!lsGet('done_'+uid+'_'+cid,false);}
function setDone(uid,cid,v){lsSet('done_'+uid+'_'+cid,v);}
function wrongCount(){return lsGet('wrongbook',[]).length;}
function wrongAdd(q){
  let wb=lsGet('wrongbook',[]);
  if(!wb.some(w=>w.chid===q.chid&&w.q===q.q)){wb.unshift(q);lsSet('wrongbook',wb);}
  updateBadge();
}
function wrongRemove(q){
  let wb=lsGet('wrongbook',[]).filter(w=>!(w.chid===q.chid&&w.q===q.q));
  lsSet('wrongbook',wb);updateBadge();
}
function render(){
  updateBadge();navActive();
  if(state.view==='home')renderHome();
  else if(state.view==='chapters')renderChapters();
  else if(state.view==='chapter')renderChapter();
  else if(state.view==='quiz')renderQuiz();
  else if(state.view==='wrong')renderWrong();
  else if(state.view==='about')renderAbout();
  window.scrollTo(0,0);
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function renderHome(){
  let h='';
  DATA.units.forEach((u,ui)=>{
    const chs=u.chapters;
    const done=chs.filter(c=>chapterDone(u.id,c.id)).length;
    h+='<div class="card unit-card" onclick="openUnit('+ui+')">'
      +'<div class="unit-emoji">'+u.emoji+'</div>'
      +'<div class="unit-info"><div class="unit-name">'+esc(u.name)+'</div>'
      +'<div class="unit-meta">'+chs.length+'章 · 已掌握 '+done+'/'+chs.length+'</div>'
      +'<div class="pbar"><i style="width:'+(chs.length?Math.round(done/chs.length*100):0)+'%"></i></div></div>'
      +'<div class="unit-arrow">›</div></div>';
  });
  app.innerHTML='<h2 class="sec">📚 选择单元开始复习</h2>'+h
    +'<div class="card about"><p style="font-size:.8rem;color:#8a97a3">💡 学完一章后做“练习”，答对率60%以上自动标记为已掌握；答错的题自动进“错题本”，可以反复重做。</p></div>';
}
function openUnit(ui){state.unit=ui;state.view='chapters';render();}
function renderChapters(){
  const u=DATA.units[state.unit];
  let h='<div class="back-row"><button class="back-btn" onclick="goHome()">← 返回</button><div class="ch-title">'+u.emoji+' '+esc(u.name)+'</div></div>';
  u.chapters.forEach((c,ci)=>{
    const d=chapterDone(u.id,c.id);
    h+='<div class="card unit-card" onclick="openChapter('+ci+')">'
      +'<div class="unit-emoji" style="font-size:1.5rem">'+c.emoji+'</div>'
      +'<div class="unit-info"><div class="unit-name">'+esc(c.name)+(d?'<span class="done-flag">✓ 已掌握</span>':'')+'</div>'
      +'<div class="unit-meta">'+c.sections.length+'节 · 练习'+c.quiz.length+'题</div></div>'
      +'<div class="unit-arrow">›</div></div>';
  });
  app.innerHTML=h;
}
function goHome(){state.view='home';render();}
function openChapter(ci){state.ch=ci;state.view='chapter';state.tab='points';render();}
function goBackChapters(){state.view='chapters';render();}
function setTab(t){state.tab=t;render();}
function renderChapter(){
  const u=DATA.units[state.unit],c=u.chapters[state.ch];
  const tabs=[['points','📖 知识点'],['key','🎯 重点'],['trap','⚠️ 易错'],['story','📚 故事'],['quiz','✍️ 练习']];
  let tabh='<div class="tabs">'+tabs.map(t=>'<button class="tab'+(state.tab===t[0]?' active':'')+'" onclick="setTab(\''+t[0]+'\')">'+t[1]+'</button>').join('')+'</div>';
  let body='';
  if(state.tab==='points'){
    body=c.sections.map(s=>{
      const pts=s.points.map(p=>'<div class="pt'+(p.k?' key':'')+'"><div class="pt-t">'+(p.k?'':'▫️ ')+esc(p.t)+'</div><div class="pt-d">'+esc(p.d)+'</div></div>').join('');
      return '<div class="card"><div style="font-weight:800;font-size:.9rem;color:#2b4a3d;margin-bottom:8px">'+esc(s.name)+'</div>'+pts+'</div>';
    }).join('');
  }else if(state.tab==='key'){
    body='<div class="card">'+c.keypoints.map(k=>'<div class="pt key"><div class="pt-t">'+esc(k.t)+'</div><div class="pt-d">'+esc(k.d)+'</div></div>').join('')+'</div>';
  }else if(state.tab==='trap'){
    body='<div class="card">'+c.traps.map(t=>'<div class="trap"><div class="w">'+esc(t.w)+'</div><div class="r">'+esc(t.r)+'</div></div>').join('')+'</div>';
  }else if(state.tab==='story'){
    body='<div class="story"><div class="st-t">📖 '+esc(c.story.title)+'</div>'
      +c.story.text.map(p=>'<p>'+esc(p)+'</p>').join('')
      +'<div class="st-tip">'+esc(c.story.tip)+'</div></div>';
  }else if(state.tab==='quiz'){
    body='<div class="card"><div style="font-weight:800;font-size:.92rem;color:#2b4a3d">✍️ 本章练习（'+c.quiz.length+'题）</div>'
      +'<div style="font-size:.8rem;color:#8a97a3;line-height:1.6;margin:6px 0 10px">每道题选择后立即判对错并看解析。答错的题会进错题本。</div>'
      +'<button class="next-btn" onclick="startQuiz(false)">开始练习 🚀</button></div>';
  }
  const d=chapterDone(u.id,c.id);
  app.innerHTML='<div class="back-row"><button class="back-btn" onclick="goBackChapters()">← 返回</button><div class="ch-title">'+c.emoji+' '+esc(c.name)+(d?'<span class="done-flag">✓ 已掌握</span>':'')+'</div></div>'
    +tabh+body
    +'<button class="btn2" onclick="toggleDone()">'+(d?'✓ 已标记掌握（点此取消）':'☆ 手动标记本章已复习')+'</button>';
}
function toggleDone(){
  const u=DATA.units[state.unit],c=u.chapters[state.ch];
  setDone(u.id,c.id,!chapterDone(u.id,c.id));render();
}
function startQuiz(redo){
  if(redo){
    const wb=lsGet('wrongbook',[]);
    if(!wb.length){return;}
    state.quiz={list:wb.map(w=>({q:w.q,opts:w.opts,ans:w.ans,why:w.why,chid:w.chid,chn:w.chn})),i:0,score:0,wrong:[],fromWrong:true};
  }else{
    const u=DATA.units[state.unit],c=u.chapters[state.ch];
    state.quiz={list:c.quiz.map((q,qi)=>({q:q.q,opts:q.opts,ans:q.ans,why:q.why,chid:u.id+'_'+c.id,chn:u.emoji+' '+c.name})),i:0,score:0,wrong:[],fromWrong:false};
  }
  state.view='quiz';render();
}
function pick(oi){
  const qz=state.quiz;if(qz.done)return;
  const cur=qz.list[qz.i];
  const optEls=document.querySelectorAll('.opt');
  optEls.forEach(o=>o.classList.add('dim'));
  const fb=document.getElementById('fb');
  if(oi===cur.ans){
    optEls[oi].classList.add('right');qz.score++;
    fb.className='fb ok';fb.innerHTML='🎉 '+(PRAISE[Math.floor(Math.random()*PRAISE.length)])+'<span class="why">📝 解析：'+esc(cur.why)+'</span>';
  }else{
    optEls[oi].classList.add('wrong');optEls[cur.ans].classList.add('right');
    qz.wrong.push(cur);
    fb.className='fb bad';fb.innerHTML='❌ 答错了<span class="why">📝 解析：'+esc(cur.why)+'</span>';
  }
  qz.done=true;
  const nb=document.getElementById('nextbtn');
  nb.style.display='block';
  nb.textContent=(qz.i<qz.list.length-1)?'下一题 →':'查看成绩 🏁';
}
function nextQ(){
  const qz=state.quiz;
  if(qz.i<qz.list.length-1){qz.i++;qz.done=false;renderQuiz();}
  else{finishQuiz();}
}
function renderQuiz(){
  const qz=state.quiz,cur=qz.list[qz.i],n=qz.list.length;
  const pct=Math.round(qz.i/n*100);
  app.innerHTML='<div class="back-row"><button class="back-btn" onclick="quitQuiz()">← 退出</button><div class="ch-title">✍️ 练习'+(qz.fromWrong?'（错题重做）':'')+'</div></div>'
    +'<div class="card"><div class="quiz-top"><span>第 '+(qz.i+1)+' / '+n+' 题</span><span>已对 '+qz.score+' 题</span></div>'
    +'<div class="qbar"><i style="width:'+pct+'%"></i></div>'
    +'<div class="qtext">'+esc(cur.q)+'</div>'
    +cur.opts.map((o,oi)=>'<button class="opt" onclick="pick('+oi+')"><b>'+(oi===0?'A':oi===1?'B':oi===2?'C':'D')+'</b>　'+esc(o.slice(2))+'</button>').join('')
    +'<div class="fb" id="fb"></div>'
    +'<button class="next-btn" id="nextbtn" style="display:none" onclick="nextQ()">下一题 →</button></div>';
  document.getElementById('nextbtn').style.display='none';
}
function quitQuiz(){
  if(state.quiz&&state.quiz.fromWrong)state.view='wrong';
  else state.view='chapter';
  state.quiz=null;render();
}
function finishQuiz(){
  const qz=state.quiz,n=qz.list.length,pct=Math.round(qz.score/n*100);
  if(qz.fromWrong){
    const wb=lsGet('wrongbook',[]);
    const keep=qz.wrong.map(w=>w.chid+'|'+w.q);
    wb.forEach(w=>{if(!keep.includes(w.chid+'|'+w.q))wrongRemove(w);});
  }else{
    qz.wrong.forEach(w=>wrongAdd(w));
    if(pct>=60){const u=DATA.units[state.unit];setDone(u.id,u.chapters[state.ch].id,true);}
  }
  const stars=pct>=90?'⭐⭐⭐':pct>=70?'⭐⭐':pct>=60?'⭐':'';
  const msg=pct>=90?'完美通关！知识全在脑子里了！':pct>=70?'掌握得不错，错题多看看！':pct>=60?'及格啦！把错题本过一遍更稳！':(TRYAGAIN[Math.floor(Math.random()*TRYAGAIN.length)]);
  const wl=qz.wrong.map((w,i)=>'<div style="padding:4px 0;border-bottom:1px dashed #f0d5d8">'+(i+1)+'. '+esc(w.q)+' <b style="color:#c0392b">答案：'+(w.ans===0?'A':w.ans===1?'B':w.ans===2?'C':'D')+'</b></div>').join('');
  app.innerHTML='<div class="card score-box">'
    +'<div class="score-emoji">'+(pct>=90?'🏆':pct>=70?'🎉':pct>=60?'😊':'💪')+'</div>'
    +'<div class="score-num">'+qz.score+' / '+n+' 题</div>'
    +'<div class="score-stars">'+stars+'</div>'
    +'<div class="score-msg">'+msg+'</div>'
    +(qz.wrong.length?'<div class="wrong-mini"><b>本次错题：</b>'+wl+'</div>':'<div class="score-msg" style="color:#1e7a48">全对！一个错题都没有！🎊</div>')
    +'<div class="btn-row"><button class="next-btn" onclick="startQuiz('+(qz.fromWrong?'true':'false')+')">再来一遍 🔄</button>'
    +'<button class="next-btn" style="background:#fff;color:#2fa866;box-shadow:none;border:2px solid #2fa866" onclick="afterQuiz()">完成 ✅</button></div></div>';
}
function afterQuiz(){
  if(state.quiz&&state.quiz.fromWrong){state.view='wrong';}
  else{state.view='chapter';state.tab='points';}
  state.quiz=null;render();
}
function renderWrong(){
  const wb=lsGet('wrongbook',[]);
  if(!wb.length){
    app.innerHTML='<div class="card score-box"><div class="score-emoji">🎊</div><div class="score-num" style="font-size:1.1rem">错题本是空的！</div><div class="score-msg">做题时答错的题会自动收集到这里，方便反复复习。</div><button class="next-btn" onclick="goHome()">去学习 📚</button></div>';
    return;
  }
  let h='<div class="back-row"><div class="ch-title">📕 错题本（'+wb.length+'题）</div></div>';
  h+=wb.map((w,i)=>'<div class="wrong-item"><span class="w-tag">'+esc(w.chn)+'</span>'
    +'<div class="w-q">'+(i+1)+'. '+esc(w.q)+'</div>'
    +'<div class="w-a">正确答案：<b>'+(w.ans===0?'A':w.ans===1?'B':w.ans===2?'C':'D')+'</b>　'+esc(w.opts[w.ans].slice(2))+'</div>'
    +'<div class="w-why">📝 '+esc(w.why)+'</div></div>').join('');
  h+='<div class="btn-row"><button class="next-btn" onclick="startQuiz(true)">错题重做 🔁</button>'
    +'<button class="btn2" style="color:#c0392b;border-color:#c0392b" onclick="clearWrong()">清空错题本 🗑</button></div>';
  app.innerHTML=h;
}
function clearWrong(){if(confirm('确定清空所有错题吗？')){lsSet('wrongbook',[]);updateBadge();render();}}
function renderAbout(){
  app.innerHTML='<div class="card about">'
    +'<h3>📕 关于本复习助手</h3>'
    +'<p>内容依据 <b>苏科版（江苏凤凰科学技术出版社）义务教育教科书·生物学七年级上册（2024秋版）</b> 整理，适用于江苏徐州初一学生。</p>'
    +'<h3>🧭 怎么用</h3>'
    +'<p>①按单元逐章学习“知识点”，重点看🔑标记和“重点”页；②考前重点过“易错点”页，考试避坑；③学完做“练习”，答对率60%以上自动标记已掌握；④错题自动进错题本，反复重做到全会为止。</p>'
    +'<h3>📱 离线使用</h3>'
    +'<p>本文件是单文件网页，不需要联网。发送到手机后用浏览器打开即可；建议收藏到浏览器书签或添加到桌面。</p>'
    +'<h3>⚠️ 说明</h3>'
    +'<p>内容依据教材整理，供复习参考；具体考点范围请以学校老师要求为准。发现内容有误可直接告诉我修改。</p>'
    +'</div>';
}
document.getElementById('nav').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  const v=b.dataset.v;
  if(v==='home')state.view='home';
  else if(v==='wrong')state.view='wrong';
  else if(v==='about')state.view='about';
  state.quiz=null;render();
});
render();
</script>
</body>
</html>
