{"t":"良渚古城","d":"浙江余杭，距今约5300—4300年（约5000年前）。发现大型水利系统、稻田、宫殿区，玉琮玉璧精美——大型城市和水利工程说明当时已有较高的经济发展水平、统治者有较强的组织调动能力；墓葬随葬品差异大，出现明显的贫富分化/阶级分化。良渚古城遗址实证了中华五千年文明史（2019年列入《世界遗产名录》）。","mn":"水利宫殿玉琮·实证五千年"},
{"t":"陶寺都城","d":"山西襄汾，距今约4300—4000年（约4000年前）。有宫城、观象台、大型墓葬区，随葬品差异大，反映当时已出现阶级分化。","mn":"宫城观象台·阶级分化"},
{"t":"炎帝黄帝的传说","d":"炎帝、黄帝之间发生过阪泉之战，黄帝打败炎帝后两人结成联盟；炎黄联盟在涿鹿之战中打败蚩尤。炎帝黄帝被尊为中华民族的人文初祖，海内外华人自称炎黄子孙；华夏族（汉族的前身）逐渐形成。","mn":"阪泉结盟·涿鹿败蚩尤·人文初祖"},
{"t":"禅让制","d":"尧、舜、禹时期，部落联盟首领传位给贤德之人，称禅让制，是公天下。大禹治水三过家门而不入，深受爱戴。","mn":"传贤不传子·公天下"},
{"t":"中华文明起源的特点","d":"多元一体：多个文化中心（黄河流域、长江流域、辽河流域等）各自发展，又相互交流、逐渐汇聚融合。","mn":"多源汇聚·多元一体"}
]}],

"story":{"title":"良渚古城——五千年前的超级工程","text":[
"1936年，考古工作者施昕更在浙江余杭良渚镇挖出黑陶和玉器，一座沉睡了五千年的古城浮出水面。",
"后来的发掘让世界震惊：古城里有宫殿区、墓葬区，城外修着长达数十公里的水坝系统——这是目前所知世界上最早的大型水利工程之一，比大禹治水的传说还早一千年！要修这样的工程，必须有一个强大的组织来调集成千上万的劳动力。玉琮上刻着神秘的兽面纹，随葬玉器多的墓主人生前地位显赫，贫富分化已经出现。",
"考古学家说：良渚证明了在夏朝之前，中华大地上已经出现了早期的国家形态。2019年，良渚古城遗址列入《世界遗产名录》，中华五千年文明史得到世界公认。",
"咱徐州也不缺史前故事：邳州大墩子遗址距今六千多年，属于大汶口文化，出土了彩陶和墓葬。当良渚人在修水坝的时候，徐州的先民正在运河边种地、制陶。"
],"tip":"良渚古城实证中华五千年文明；中华文明起源多元一体；传说与考古相互印证。"},

{"type":"essay","lv":3,"sec":"s1","mat":{"title":"考古探秘——化石与遗址里的历史","text":["材料一：在云南省元谋县，考古学家发现了两枚古人类的牙齿化石，经测定距今约170万年。","材料二：在北京周口店龙骨山，考古学家发现了成堆的灰烬层，其中有烧骨和烧过的朴树籽。","材料三：在浙江余姚河姆渡遗址，出土了大量稻谷堆积、骨耜和干栏式建筑的木构件。"]},"subs":[{"q":"研究古人类历史的重要依据是什么？","score":2,"key":["化石是研究古人类历史和古环境变迁的重要依据","考古发掘（遗址、遗物）是了解史前社会的主要途径"]},{"q":"材料二中的灰烬层说明了北京人掌握了什么技能？","score":2,"key":["北京人会使用火","能长时间保存火种"]},{"q":"根据材料三，说说河姆渡人的生产和生活有什么特点。","score":6,"key":["种植水稻","使用骨耜耕地","住干栏式建筑","挖木结构水井"]}],"why":"化石和遗址是研究史前社会的主要依据；北京人会使用火并保存火种；河姆渡人种水稻、用骨耜、住干栏式建筑、挖水井。","q":"阅读材料，回答问题："},

{"t":"夏朝的建立","d":"约公元前2070年，禹建立夏朝，定都阳城——中国历史上第一个王朝，我国由原始社会进入奴隶社会。禹死后儿子启继位，世袭制代替禅让制，公天下变成家天下。河南偃师二里头遗址反映夏朝社会。夏朝最后一个王桀施行暴政。","mn":"前2070禹建·阳城·桀亡"},
{"t":"商朝的兴亡","d":"约公元前1600年，汤灭夏建立商朝，定都亳。商王盘庚迁都到殷（今河南安阳），此后商朝也称殷朝。殷墟出土甲骨文和青铜器。商纣王暴虐无道。","mn":"汤都亳·盘庚迁殷·纣亡"},
{"t":"默写朝代歌","d":"夏商与西周，东周分两段。春秋与战国，一统秦两汉。三分魏蜀吴，两晋前后沿。南北朝并立，隋唐五代传。宋元明清后，皇朝至此完。"},
{"t":"西周的建立与分封制","d":"公元前1046年，周武王在牧野之战中打败商纣，建立西周，定都镐京。西周实行分封制：周王把土地和人民分给宗亲和功臣，形成天子—诸侯—卿大夫—士的等级序列；诸侯有义务向周王进献贡赋、服从调兵。宗法制以嫡长子继承为核心。","mn":"前1046武王建·镐京"},
{"t":"分封制的目的、权力与意义","d":"目的：为稳定周初的政治形势、加强对地方的控制、扩大统治范围。诸侯的权力：管理土地和民众、建立诸侯国，有一定独立性，可以再分封。意义：确立了严格的等级结构和统治秩序；但诸侯具有较大独立性，容易导致国家分裂战乱。"},
{"t":"西周的灭亡","d":"公元前841年发生国人暴动；公元前771年犬戎攻破镐京，周幽王被杀，西周灭亡。公元前770年周平王东迁洛邑（今洛阳），东周开始。","mn":"前771犬戎灭西周·平王东迁"}
]},

{"t":"王室衰微","d":"公元前770年周平王东迁洛邑，东周开始。春秋时期（公元前770—前476年）王室衰微，诸侯势力强大，竞相争霸，礼崩乐坏。"},
{"t":"春秋争霸","d":"齐桓公任用管仲改革，以尊王攘夷为号召，葵丘会盟，成为春秋第一个霸主；晋文公在城濮之战中大败楚军（退避三舍），称霸中原；楚庄王问鼎中原。春秋五霸：齐桓公、晋文公、楚庄王、秦穆公、宋襄公（另一说法含吴王阖闾、越王勾践）。","mn":"首霸齐桓·尊王攘夷"},
{"t":"诸侯争霸的影响","d":"①促进了局部地区的统一；②促进了各民族的交融，产生了华夏认同观念；③给人民带来了巨大的灾难。"},
{"t":"生产力的变革","d":"春秋后期，铁制农具和牛耕出现，农业深耕细作，井田制逐步瓦解——这是春秋战国大变革的根本原因。","mn":"铁器牛耕·井田瓦解"},
{"t":"老子与孔子","d":"老子：道家学派创始人，著有《道德经》，核心思想是道，主张无为而治（道法自然）；他认为一切事物都有对立面，对立双方能够相互转化。孔子：儒家学派创始人，核心思想是仁，主张为政以德，创办私学、有教无类，是著名的思想家、大教育家，言行记录在《论语》中。","mn":"老子道·无为·对立转化；孔子仁·为政以德·有教无类"}
]},
{"id":"s3","name":"第6课 战国时期的社会变革","mn":"战国七雄·商鞅变法强秦·李冰都江灌天府","points":[
{"t":"战国七雄","d":"公元前475年进入战国时期，至公元前221年秦统一全国结束。七雄：齐、楚、秦、燕、赵、魏、韩——东齐、南楚、西秦、北燕，中间自北向南是赵魏韩。著名战役：桂陵之战（围魏救赵）、马陵之战、长平之战（秦赵）。","mn":"东齐南楚西秦北燕·中间赵魏韩"},
{"t":"商鞅变法","d":"公元前356年，秦孝公任用商鞅变法：废除井田制、奖励军功、奖励耕织（重农抑商）、建立县制、编制户口、严明法度。使秦国富国强兵，为以后秦统一全国奠定基础。商鞅触犯旧贵族利益被车裂，但新法继续推行。","mn":"前356·废井田·奖军功·行县制"},
{"t":"商鞅变法的措施、影响与启示","d":"目的：为了富国强兵。措施：①确立县制，由国君直接派官吏治理；②废除贵族的世袭特权；③建立户籍制度，加强对人民的管理；④严明法度，禁止私斗；⑤废除旧的土地制度；⑥鼓励耕织，生产粮食、布帛多的人可免除徭役；⑦统一度量衡；⑧奖励军功，对有军功者授予爵位并赏赐土地。影响：提高了秦国国力，提高了秦军战斗力，为秦统一中国奠定了基础。成功的原因：顺应历史发展趋势、符合秦国国情；秦孝公坚决支持；商鞅取信于民、公正无私、坚持改革创新。启示：改革要顺应历史发展的潮流，改革是社会发展的动力。"},
{"t":"都江堰","d":"战国后期（公元前256年），秦国蜀郡郡守李冰父子主持修建都江堰（位于成都附近的岷江上），集防洪、灌溉、水运于一身，使成都平原成为沃野，号称天府之国，至今仍发挥作用。","mn":"李冰父子·成都天府之国"}
]},
{"id":"s4","name":"第7课 百家争鸣","mn":"儒仁德·道无为·墨兼爱·法法治","points":[
{"t":"百家争鸣的背景","d":"春秋战国时期社会大变革；士阶层崛起，聚众讲学；各家针对社会问题提出不同主张，相互辩驳，形成百家争鸣。"},
{"t":"儒家","d":"孔子（仁、为政以德、有教无类）；孟子（实行仁政，民贵君轻，拥护正义之战、仁者无敌）；荀子（主张礼治，礼法并用）。"},
{"t":"道家","d":"老子（道法自然、无为而治）；庄子（顺其自然、追求精神自由，天人合一）。"},
{"t":"墨家与法家","d":"墨子（兼爱、非攻、选贤、提倡节俭）；韩非（法家集大成者，主张以法治国、树立君主权威、建立中央集权专制统治）——后来秦始皇采纳法家主张。"},
{"t":"兵家与争鸣的意义","d":"孙武《孙子兵法》（知己知彼，百战不殆）。百家争鸣促进了思想文化的繁荣，是我国古代第一次思想文化发展的高峰，为古代思想文化的发展奠定了基础，对后世产生了重要影响。"}
]},
{"id":"s5","name":"第8课 夏商周时期的科技与文化","mn":"甲骨青铜诗风雅·扁鹊四诊曾侯钟","points":[
{"t":"青铜器","d":"商周是青铜时代。司母戊鼎（又称后母戊鼎）是迄今世界上出土的最重的青铜器；四羊方尊精美绝伦。青铜器主要用于饮食、祭祀和军事，是身份地位和权力的象征。","mn":"后母戊鼎最重·四羊方尊最精"},
{"t":"甲骨文","d":"商朝人刻写在龟甲和兽骨上的文字，记录占卜等内容。甲骨文已具备汉字的基本结构，是我国已发现的古代文字中年代最早、体系较为完整的文字，今天的汉字由它发展而来——我国有文字可考的历史从商朝开始。","mn":"龟甲兽骨·有文字可考从商起"},
{"t":"金文","d":"商周青铜器上铸刻的文字，又称钟鼎文、铭文。"},
{"t":"天文历法与医学","d":"商朝历法完备；《诗经》中记载了日食；战国名医扁鹊使用望、闻、问、切四诊法诊断疾病；战国时期的医书《黄帝内经》问世。"},
{"t":"文学与音乐","d":"《诗经》是我国第一部诗歌总集，共305篇，分风雅颂三部分，与楚辞并称为我国诗歌的两大源头；战国屈原创作《离骚》等楚辞名篇；战国曾侯乙编钟是古代音乐瑰宝。"}
]}],

"story":{"title":"徙木立信——商鞅的第一招","text":[
"公元前356年，商鞅要在秦国变法。老百姓不相信他，他就在都城南门立了一根三丈长的木头，宣布：谁把木头搬到北门，赏十金。",
"围观的人议论纷纷：搬根木头就给钱？没人敢动。商鞅把赏金提高到五十金，终于有个人把木头搬到了北门，商鞅当场兑现。这下全城都知道了：这个人说话算数！商鞅随即颁布新法。",
"新法奖励耕织、奖励军功，贵族没有军功就不能享受特权，触怒了大批旧贵族。太子犯了法，商鞅就处罚了太子的两位老师。新法推行十年，秦国路不拾遗，士兵打仗个个争功——秦国从此富强起来。",
"秦孝公死后，商鞅被旧贵族反扑车裂而死。但新法已经深入人心，继续推行。几十年后，正是这个强大的秦国，扫平六国统一了天下。"
],"tip":"商鞅变法（前356年，秦孝公）：废井田、奖军功、奖耕织、行县制——富国强兵，为统一奠定基础。"},

{"type":"essay","lv":3,"sec":"s1","mat":{"title":"西周的分封制","text":["材料一：周武王建立西周后，把土地和人民分给宗亲和功臣，让他们建立诸侯国。诸侯管理土地和民众，还可以再分封。","材料二：周王与诸侯的关系是：诸侯要向周王进献贡赋、服从调兵。","材料三：周朝形成了天子—诸侯—卿大夫—士的等级序列。"]},"subs":[{"q":"西周实行分封制的目的是什么？","score":4,"key":["为稳定周初的政治形势","加强对地方的控制","扩大统治范围"]},{"q":"根据材料二，诸侯对周王有哪些义务？","score":2,"key":["进献贡赋","服从调兵"]},{"q":"根据材料三，分封制形成的社会等级是什么？分封制有什么意义？","score":6,"key":["天子、诸侯、卿大夫、士","确立了严格的等级结构和统治秩序","诸侯具有较大独立性，容易导致国家分裂战乱"]}],"why":"分封制的目的、义务、等级与意义，按背诵单口径作答。","q":"阅读材料，回答问题："},
{"type":"essay","lv":3,"sec":"s4","mat":{"title":"百家争鸣","text":["材料一：孔子主张仁者爱人、为政以德；孟子主张实行仁政，民贵君轻。","材料二：老子主张无为而治，认为一切事物都有对立面，对立双方能够相互转化；庄子追求精神自由。","材料三：墨子主张兼爱、非攻；韩非主张以法治国，树立君主权威，建立中央集权专制统治。"]},"subs":[{"q":"材料一中的思想家属于哪一学派？","score":2,"key":["儒家"]},{"q":"材料二中老子的哲学思想是什么？","score":2,"key":["一切事物都有对立面","对立双方能够相互转化"]},{"q":"结合材料，说说百家争鸣有什么历史影响。","score":6,"key":["促进了思想文化的繁荣","是我国古代第一次思想文化发展的高峰","为古代思想文化的发展奠定了基础","对后世产生了重要影响"]}],"why":"百家争鸣各家主张及其影响，按背诵单口径作答。","q":"阅读材料，回答问题："}

{"id":"s1","name":"第9课 秦统一中国","mn":"前221秦统一·皇帝丞相郡县制","points":[
{"t":"秦统一六国","d":"公元前230—前221年，秦先后灭韩、赵、魏、楚、燕、齐。公元前221年，嬴政建立秦朝，定都咸阳——结束了春秋战国长期分裂混乱的局面，建立起我国历史上第一个统一的多民族的封建国家。","mn":"前221·咸阳·第一个统一多民族"},
{"t":"中央集权制度","d":"最高统治者称皇帝（嬴政自称始皇帝）；中央实行三公九卿制，设丞相（行政）、太尉（军事）、御史大夫（监察）；地方废除分封制、实行郡县制——郡县长官由朝廷直接任免。郡县制加强了中央对地方的控制，开创了此后我国历代王朝地方行政的基本模式。","mn":"皇帝·三公九卿·郡县制"},
{"t":"巩固统一的措施","d":"文化上统一文字（以小篆为标准，有利于政令推行，促进文化交流）；经济上统一货币（圆形方孔半两钱）、统一度量衡，促进了经济发展；交通上统一车轨和道路宽度，修筑道路，促进交通往来；思想上焚书坑儒。","mn":"书同文·币半两·度同量·车同轨"},
{"t":"开疆拓土","d":"军事上统一岭南及东南地区，设郡管理；派蒙恬北击匈奴，修筑万里长城（西起临洮，东到辽东）；开凿灵渠。秦朝疆域：东至东海，西到陇西，北至长城一带，南达南海。","mn":"西临洮·东辽东·灵渠通"}
]},
{"id":"s2","name":"第10课 秦末农民大起义","mn":"大泽乡起义·巨鹿破釜·垓下楚歌","points":[
{"t":"秦的暴政","d":"赋税沉重（农民上交收成的三分之二）；徭役、兵役繁重（修阿房宫、骊山陵、长城）；法律严苛、刑罚残酷（族诛、连坐）；焚书坑儒；秦二世更加残暴。","mn":"赋役重·刑罚酷·焚书坑儒"},
{"t":"陈胜吴广起义","d":"公元前209年，陈胜、吴广在大泽乡起义（根本原因：秦的暴政；直接原因：遇雨误期，按律当斩；喊出王侯将相宁有种乎），建立张楚政权——中国历史上第一次农民大起义。","mn":"前209大泽乡·张楚·第一次农民大起义"},
{"t":"秦朝灭亡","d":"陈胜吴广起义失败后，刘邦、项羽继续反秦。项羽在巨鹿之战中破釜沉舟、以少胜多，消灭秦军主力；公元前207年刘邦率军入咸阳，秦朝灭亡。","mn":"巨鹿破釜沉舟"},
{"t":"楚汉之争","d":"秦亡后，项羽自称西楚霸王，定都彭城（今江苏徐州）；刘邦被封为汉王。刘邦收揽民心（约法三章）、善用人才，最终在垓下之战中四面楚歌，项羽兵败自刎乌江——刘邦获胜（项羽刚愎自用、依赖武力，最终失败）。刘邦就是沛县（今徐州）人。","mn":"四面楚歌·垓下定胜负"}
]},
{"id":"s3","name":"第11课 西汉建立和文景之治","mn":"休养生息·文景之治","points":[
{"t":"西汉建立","d":"公元前202年，刘邦建立汉朝，定都长安，刘邦就是汉高祖。西汉初年生产遭到破坏，到处残破荒凉。","mn":"前202刘邦都长安"},
{"t":"休养生息政策","d":"汉初经济凋敝，刘邦吸取秦亡教训，实行休养生息：让士兵解甲归田、释放奴婢为平民、鼓励农业生产、轻徭薄赋（十五税一）、与匈奴和亲。","mn":"解甲归田·释放奴婢·十五税一"},
{"t":"文景之治","d":"汉文帝、汉景帝继续推行休养生息：以农为本、进一步减轻赋税徭役（三十税一）、以德化民、勤俭治国、提倡节俭。文景时期政治清明、经济发展、人民生活安定，史称文景之治——中国封建社会的第一个治世。","mn":"文景之治·第一个治世"}
]},
{"id":"s4","name":"第12课 汉武帝巩固大一统王朝","mn":"推恩尊儒·五铢盐铁·北击匈奴","points":[
{"t":"政治上：推恩令","d":"汉武帝采纳主父偃建议颁布推恩令，诸侯王的封地和势力越来越小，再也无力对抗中央；以各种理由削爵夺地除国；将豪强迁往京师；设立刺史制度监察地方官吏和豪强。","mn":"推恩令·削爵夺地·刺史监察"},
{"t":"思想上：尊崇儒术","d":"接受董仲舒建议，罢黜百家，尊崇儒术；兴办太学，教授五经，选拔儒士——从此儒学成为封建社会的正统思想。","mn":"罢黜百家·尊崇儒术·兴太学"},
{"t":"经济上","d":"铸币权收归中央，统一铸造五铢钱；设盐铁官，实行盐铁酒官营专卖；统一调配物资，平抑物价；对商人征收车船税。","mn":"五铢钱·盐铁官营"},
{"t":"军事上：北击匈奴","d":"派卫青、霍去病北击匈奴，公元前119年漠北战役大胜，匈奴无力再与西汉对抗。","mn":"卫青霍去病·前119漠北大捷"},
{"t":"意义","d":"汉武帝从政治、思想、经济、军事等方面巩固了大一统局面，使西汉进入鼎盛时期。"}
]},

{"t":"王莽建新朝","d":"西汉后期外戚王莽夺取政权，公元9年建立新朝，西汉灭亡。"},
{"t":"东汉建立","d":"公元25年，刘秀（汉光武帝）称帝，定都洛阳，史称东汉。","mn":"25年刘秀都洛阳"},
{"t":"光武中兴","d":"刘秀释放奴婢、减轻田租、减轻刑罚、合并郡县、裁减官员、加强对官吏的监督、整顿吏治、允许北方少数民族内迁缓和民族矛盾——社会安定、经济恢复，史称光武中兴。","mn":"光武中兴"},
{"t":"东汉衰落","d":"东汉中后期外戚与宦官交替专权，政治黑暗，豪强大族势力壮大。184年张角领导的黄巾起义爆发——一场有组织的大规模农民起义，沉重打击了东汉的统治，导致了州牧割据。","mn":"外戚宦官交替·黄巾起义"}
]},
{"id":"s6","name":"第14课 沟通中外文明的丝绸之路","mn":"张骞凿空·都护设府·丝路连欧亚","points":[
{"t":"张骞出使西域","d":"公元前138年，张骞第一次出使西域（联络大月氏夹击匈奴）；公元前119年第二次出使。张骞出使西域被称为凿空之旅，促进了汉朝与西域各国的相互了解与往来。","mn":"前138凿空"},
{"t":"西域都护的设置","d":"公元前60年，西汉设置西域都护府，管理西域——标志着西域正式归属中央政权管辖。东汉时期，班超、甘英、班勇经营西域，管辖西域的机构是西域长史府。","mn":"前60都护府·西域归中央"},
{"t":"陆上丝绸之路","d":"路线：长安→河西走廊→西域→中亚、西亚→欧洲、北非。中国的丝绸、漆器、开渠凿井铸铁技术西传；西域的核桃、葡萄、石榴、苜蓿、良种马、乐器等传入中国。丝绸之路是古代东西方往来的大动脉，促进了东西方贸易与文化交流。","mn":"长安—河西—西域—中亚西亚—欧洲北非"},
{"t":"海上丝绸之路","d":"从东南沿海港口出发，经中南半岛南下，穿过马六甲海峡，最远抵达印度半岛南端和锡兰（今斯里兰卡）。"}
]},

{"t":"造纸术","d":"西汉时期人们已经懂得造纸；东汉蔡伦改进造纸工艺（105年），纸价低廉，便利书写和典籍流传，促进了思想文化的传播——造纸术是中国对世界文明的伟大贡献之一。","mn":"105年蔡伦改进造纸术"},
{"t":"医学","d":"张仲景著《伤寒杂病论》，提出辨证施治，被尊为医圣；华佗发明麻沸散、创编五禽戏，被称为神医。","mn":"医圣仲景·神医华佗"},
{"t":"数学与农学","d":"《九章算术》总结了战国到东汉的数学成就，是当时世界先进的数学著作；秦汉时期代表性的农学著作是《氾胜之书》。"},

{"t":"宗教","d":"佛教产生于古印度，两汉之际传入中国；道教于东汉末年在民间兴起（张角太平道、张陵五斗米道）。","mn":"佛两汉之际来·道东汉末兴"}
]}],

{"t":"秦汉文化成就表","d":"造纸（蔡伦改进）、医学（张仲景医圣、华佗麻沸散五禽戏）、史学（司马迁《史记》纪传体通史）、宗教（佛教传入、道教创立）。","mn":"蔡伦纸·医圣神医·史记·佛道"}

"story":{"title":"大风起兮云飞扬——刘邦项羽与徐州","text":[
"公元前209年，大泽乡的烽火燃起，各地纷纷起兵。沛县泗水亭长刘邦押送民夫去骊山，半路放走民夫，自己拉起队伍。他回到沛县，被乡亲们拥立为沛公——沛县，就在今天的徐州。",
"反秦大军里最猛的是项羽，巨鹿之战破釜沉舟，一战威震天下。他自立为西楚霸王，定都彭城——还是徐州。刘邦被封为汉王，两人随后打了四年楚汉之争。最后垓下之战，汉军四面唱起楚歌，项羽军心瓦解，自刎乌江。",
"刘邦赢了。公元前202年，他建立汉朝。多年后回到沛县，与乡亲们喝酒唱歌，留下了那首著名的《大风歌》：大风起兮云飞扬，威加海内兮归故乡，安得猛士兮守四方！",
"汉朝四百年的基业从这里开始。我们民族叫汉族，语言叫汉语，文字叫汉字——都源于刘邦开创的这个王朝。今天徐州还有狮子山楚王陵、汉兵马俑博物馆，两千年前的故事，就埋在家乡的地下。"
],"tip":"刘邦沛县人、项羽都彭城；西汉前202年建；徐州是两汉文化重镇。"},

{"type":"choice","lv":2,"sec":"s2","q":"项羽自立为西楚霸王，定都彭城。彭城是今天的（　）","opts":["A. 南京","B. 徐州","C. 郑州","D. 扬州"],"ans":1,"why":"彭城即今江苏徐州；刘邦就是沛县（今属徐州）人。"},
{"type":"choice","lv":1,"sec":"s3","q":"中国封建社会的第一个治世是（　）","opts":["A. 光武中兴","B. 文景之治","C. 贞观之治","D. 开元盛世"],"ans":1,"why":"汉文帝汉景帝时政治清明、经济发展，史称文景之治，是第一个治世。"},

{"type":"choice","lv":2,"sec":"s4","q":"汉武帝实行推恩令后，诸侯王的子弟人人都能分到封地，几代之后，诸侯的封地越分越小，再也无力对抗中央。推恩令最直接的效果是（　）","opts":["A. 削弱了诸侯国的势力","B. 完全废除了诸侯国","C. 增加了朝廷的赋税","D. 扩大了诸侯的领地"],"ans":0,"why":"推恩令让诸侯王的封地和势力越来越小，再也无力对抗中央。"},
{"type":"choice","lv":3,"sec":"s6","q":"汉朝的商人沿丝绸之路西行，归来时他们的行囊里可能装着（　）","opts":["A. 丝绸","B. 漆器","C. 葡萄、核桃","D. 铸铁工具"],"ans":2,"why":"丝绸、漆器、开渠凿井铸铁技术西传；西域的核桃、葡萄、石榴、苜蓿等传入中国。"},
{"type":"tf","lv":1,"sec":"s1","q":"秦朝是中国历史上第一个封建国家。","ans":false,"why":"准确说法：第一个统一的多民族的封建国家——夏商周是奴隶制王朝。"},
{"type":"tf","lv":1,"sec":"s1","q":"秦统一后，在全国推行分封制管理地方。","ans":false,"why":"秦朝废除分封制，实行郡县制，郡县长官由朝廷直接任免，不能世袭。"},

{"type":"essay","lv":3,"sec":"s2","mat":{"title":"秦的暴政与陈胜吴广起义","text":["材料一：秦朝赋税沉重，农民要把收成的三分之二上缴国家；徭役、兵役繁重，很多人去修阿房宫、骊山陵、长城，再也没有回家；法律严苛，刑罚残酷。","材料二：公元前209年，九百多个贫苦农民被征发去戍守渔阳，走到大泽乡遇大雨，道路不通，误了期限。按秦法，误期当斩。陈胜、吴广说：王侯将相宁有种乎？于是率众起义。","材料三：起义军建立张楚政权，各地农民纷纷响应。"]},"subs":[{"q":"根据材料一，秦朝的暴政有哪些表现？","score":4,"key":["赋税沉重","徭役、兵役繁重","法律严苛，刑罚残酷"]},{"q":"陈胜吴广起义的根本原因和直接原因分别是什么？","score":2,"key":["根本原因：秦的暴政","直接原因：遇雨误期，按律当斩"]},{"q":"陈胜吴广起义在中国历史上有什么地位？","score":2,"key":["是中国历史上第一次农民大起义"]}],"why":"秦的暴政是起义的根本原因；陈胜吴广起义是中国历史上第一次农民大起义。","q":"阅读材料，回答问题："},
{"type":"essay","lv":3,"sec":"s6","mat":{"title":"丝绸之路——东西方往来的大动脉","text":["材料一：公元前138年，张骞出使西域，历经千辛万苦，带回了西域各国的情况。张骞出使西域被称为凿空之旅。","材料二：汉朝的丝绸、漆器、开渠凿井铸铁技术传到西方；西域的核桃、葡萄、石榴、苜蓿、良种马、乐器等传入中国。","材料三：公元前60年，西汉设置西域都护府，管理西域。"]},"subs":[{"q":"为丝绸之路的开通奠定基础的事件是什么？","score":2,"key":["张骞通西域","张骞出使西域"]},{"q":"根据材料二，丝绸之路的开通有什么历史影响？","score":4,"key":["是古代东西方往来的大动脉","促进了东西方贸易与文化交流"]},{"q":"西域都护府的设置有什么标志性意义？","score":2,"key":["标志着西域正式归属中央政权"]}],"why":"张骞凿空奠定丝路基础；丝路是东西方往来大动脉；前60年西域正式归属中央政权。","q":"阅读材料，回答问题："}
]}
]},

{"id":"s1","name":"第16课 三国鼎立","mn":"官渡定北方·赤壁鼎三分","points":[
{"t":"官渡之战","d":"公元200年，曹操在官渡之战中以少胜多打败袁绍，为统一北方打下基础。","mn":"200曹操胜袁绍"},
{"t":"赤壁之战","d":"公元208年，孙权、刘备联军在赤壁之战中以少胜多打败曹操——奠定了三国鼎立局面形成的基础。","mn":"208孙刘胜曹操"},
{"t":"三国鼎立的形成","d":"220年曹丕称帝建魏，定都洛阳；221年刘备称帝建蜀汉，定都成都；229年孙权称帝建吴，定都建业（今南京）。三国鼎立局面形成。","mn":"220魏→221蜀→229吴"},
{"t":"三国的发展","d":"魏国兴修水利、重视农业，发明翻车；蜀国诸葛亮注重发展经济、改善民族关系，开发西南；吴国开发江东，造船业发达，发展海外贸易，230年孙权派卫温率船队到达夷洲（今台湾），加强了台湾与内地的联系。","mn":"魏翻车·蜀治西南·吴船通夷洲"},
{"t":"三国鼎立的影响","d":"①实现了局部统一；②促进了地方经济的发展；③促进了民族交融；④为全国统一奠定基础。"}
]},
{"id":"s2","name":"第17课 西晋的短暂统一和北方各族的内迁","mn":"西晋短暂统·八王乱·五胡内迁","points":[
{"t":"西晋统一","d":"263年魏灭蜀；266年司马炎（晋武帝）建立西晋，定都洛阳；280年西晋灭吴，统一全国；316年，内迁的匈奴人攻灭西晋。","mn":"266建·280统·316亡"},
{"t":"八王之乱","d":"晋惠帝时，宗室诸王为争夺皇位混战十几年，史称八王之乱。八王之乱给北方带来巨大灾难，中原人民大量南迁，出现我国古代第一次大规模人口迁徙，严重削弱西晋国力，西晋由盛转衰。","mn":"宗室内斗·人口南迁"},
{"t":"北方各族的内迁","d":"东汉、魏晋时期，北方游牧民族匈奴、鲜卑、羯、氐、羌不断内迁（五胡），与汉族杂居，促进民族交融。","mn":"匈奴鲜卑羯氐羌"},
{"t":"西晋灭亡与十六国","d":"316年，内迁的匈奴人攻灭西晋。此后北方先后出现15个主要政权，加上西南的成汉，总称十六国。4世纪后期，氐族前秦苻坚任用汉人王猛为相，统一了黄河流域。","mn":"前秦氐族·统一黄河流域"}
]},
{"id":"s3","name":"第18课 东晋南朝政治和江南地区开发","mn":"淝水草木皆兵·北人南迁开发江南","points":[
{"t":"东晋的建立","d":"317年，司马睿在建康（今南京）重建晋朝，史称东晋。政权依赖王导等世家大族，王与马，共天下——世家大族势力强大（门阀政治）。","mn":"317司马睿·王与马共天下"},
{"t":"淝水之战","d":"383年，前秦苻坚率大军南下进攻东晋，东晋以少胜多大败前秦——苻坚草木皆兵、风声鹤唳，狼狈逃回北方。淝水之战后前秦瓦解，北方再度分裂混战；东晋相对稳定，经济发展。","mn":"383风声鹤唳·草木皆兵"},
{"t":"南朝","d":"420年，东晋大将刘裕自立为帝，国号宋。此后南方先后出现宋、齐、梁、陈四个王朝，都定都建康，史称南朝（其中疆域最大的是宋，南方处于劣势开始于梁）。","mn":"宋齐梁陈·都建康"},
{"t":"江南地区的开发","d":"原因：①中原人南迁，带来了大量劳动力和先进的工具、技术；②南方社会安定；③人民的辛勤劳动；④自然条件优越；⑤政府政策的支持。表现：耕地面积增加，兴修水利；改进生产技术（犁耕、精耕细作、水稻育秧移栽、稻麦兼作、岭南双季稻）；实行多种经营（种桑养蚕、果树、药材）；建康等城市繁荣。影响：为经济重心南移奠定了基础。","mn":"北人南迁最主因·经济重心南移奠基"}
]},
{"id":"s4","name":"第19课 北朝政治和北方民族大交融","mn":"孝文迁洛汉化·民族交融主流","points":[
{"t":"北魏统一北方","d":"439年，鲜卑族拓跋部建立的北魏统一北方，结束十六国混战。北魏后分裂为东魏、西魏，又分别被北齐、北周取代，与北魏合称北朝。","mn":"439北魏统一北方"},
{"t":"北魏孝文帝改革","d":"494年孝文帝迁都洛阳，推行汉化措施：官员在朝廷使用汉语、以汉服代替鲜卑服、改鲜卑姓为汉姓（拓跋改为元）、鼓励鲜卑贵族与汉族贵族通婚、采用汉族官制律法。影响：促进了民族交融，增强了北魏实力。","mn":"迁洛·说汉语·穿汉服·改汉姓·通婚"},
{"t":"北方民族大交融","d":"表现：①经济生产：少数民族向汉族学习农业，汉族向少数民族学习畜牧；②生活习俗：少数民族开始定居生活，汉族学习少数民族的食物、服装、用具等；③政治制度：少数民族统治者与汉族士人合作，实行中央集权制度；④文化艺术：汉语成为北方主要的通用语言，汉族学习少数民族的乐器、歌舞；⑤民族心理：各族认同感加强，胡汉观念逐渐淡薄；⑥民族关系：总体上民族隔阂消解、民族关系缓和，北朝后期出现民族大交融。影响：为中华民族的发展注入了新的活力，进一步丰富了中华民族的物质文化和精神文化，为隋唐时期统一多民族国家的发展奠定了基础。民族交融是这一时期历史发展的主流。","mn":"六方面交融·为隋唐奠基"}
]},
{"id":"s5","name":"第20课 三国两晋南北朝时期的科技与文化","mn":"齐民要术·祖率精七位·书圣顾画·云冈龙门","points":[
{"t":"农学：贾思勰与《齐民要术》","d":"贾思勰著《齐民要术》，总结了农林牧副渔等方面的技术，主张遵循规律、因地制宜、多种经营，是我国现存最早的一部完整的农书，被誉为中国古代农业百科全书。","mn":"现存最早完整农书"},
{"t":"数学天文：祖冲之","d":"把圆周率精确到小数点以后第七位（3.1415926与3.1415927之间），领先世界近千年；著有《缀术》；还制定了当时最先进的历法《大明历》，制造了指南车、水碓磨、千里船。","mn":"圆周率第七位·领先近千年"},
{"t":"书法绘画","d":"曹魏钟繇、胡昭擅长行书草书隶书；东晋王羲之被后人誉为书圣，代表作《兰亭集序》被称为天下第一行书。东晋顾恺之擅长人物画，代表作《女史箴图》《洛神赋图》。","mn":"书圣兰亭·顾恺之人物画"},
{"t":"石窟艺术","d":"南北朝统治者崇佛，开凿山西大同云冈石窟和河南洛阳龙门石窟——石窟兼收外来佛教艺术特色，是中外文化交融的见证。","mn":"云冈大同·龙门洛阳"},
{"t":"地理学与文学","d":"北魏郦道元著《水经注》，是一部综合性的地理学著作。三国两晋南北朝时期的文学成就：曹操父子的诗歌、陶渊明的田园诗、北朝民歌和南朝民歌。"}
]}],
"keypoints":[
{"t":"三个以少胜多的战役（高频考点）","d":"官渡之战（200年，曹操胜袁绍）；赤壁之战（208年，孙刘胜曹操）；淝水之战（383年，东晋胜前秦）。记住时间、双方、结果三要素。","mn":"官渡200·赤壁208·淝水383"},

<script>
'use strict';
const DATA = JSON.parse(document.getElementById('DATA').textContent);
const app = document.getElementById('app');
function lsGet(k,f){try{const v=localStorage.getItem('lishi_'+k);return v==null?f:JSON.parse(v);}catch(e){return f;}}
function lsSet(k,v){try{localStorage.setItem('lishi_'+k,JSON.stringify(v));return true;}catch(e){return false;}}
const KIND={choice:{n:'选择'},tf:{n:'判断'},fill:{n:'填空'},order:{n:'排序'},essay:{n:'材料'}};
const RANKS=[{n:'青铜',min:0,ic:'🥉'},{n:'白银',min:50,ic:'🥈'},{n:'黄金',min:150,ic:'🥇'},{n:'王者',min:350,ic:'👑'}];
const state={view:'home',unit:0,ch:0,quiz:null,tab:'points',pick:{show:false,secs:[],lvs:[1,2,3]}};
const PRAISE=['太棒了！🎉','厉害！👏','满分选手就是你！🏆','继续保持！💪','真不错！⭐','完全正确！🎯','好样的！🚀'];
const TRYAGAIN=['没关系，记下解析，再练一遍就会了！💪','别灰心，错题已进错题本，下次一定行！📕','进步都是从错题开始的！🌱'];
function qKind(it){return it.t||it.type||'choice';}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function ymd(d){d=d||new Date();return ''+d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0');}
function shuffle(a,seed){
  const arr=a.slice();
  if(seed==null){for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}return arr;}
  let s=seed>>>0;const rnd=()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296;};
  for(let i=arr.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}
  return arr;
}
function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function navActive(){document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.v===state.view));}
function updateBadge(){const wb=lsGet('wrongbook',[]);const b=document.getElementById('wbadge');b.textContent=wb.length||'';b.style.display=wb.length?'inline-block':'none';}
function allChapters(){const r=[];DATA.units.forEach((u,ui)=>u.chapters.forEach((c,ci)=>r.push({u:ui,c:ci,ch:c})));return r;}
function chapterDone(uid,cid){return !!lsGet('done_'+uid+'_'+cid,false);}
function setDone(uid,cid,v){lsSet('done_'+uid+'_'+cid,v);}
function wrongCount(){return lsGet('wrongbook',[]).length;}
function keyOf(w){return w.qi!=null?w.chid+'|i'+w.qi:w.chid+'|q'+w.q;}
function wrongAdd(q){
  let wb=lsGet('wrongbook',[]);
  if(!wb.some(w=>keyOf(w)===keyOf(q))){wb.unshift(q);lsSet('wrongbook',wb);}
  updateBadge();
}
function wrongRemove(q){
  let wb=lsGet('wrongbook',[]).filter(w=>keyOf(w)!==keyOf(q));
  lsSet('wrongbook',wb);updateBadge();
}
function statsAdd(ok,essayGot){const s=lsGet('stats',{ans:0,right:0,essay:0});s.ans++;if(ok)s.right++;if(essayGot)s.essay+=essayGot;lsSet('stats',s);}
function rankOf(right){let r=RANKS[0];for(const x of RANKS){if(right>=x.min)r=x;}return r;}
function rankNext(right){for(const x of RANKS){if(right<x.min)return x;}return null;}
let timerId=null;
function stopTimer(){if(timerId!=null){clearInterval(timerId);timerId=null;}}
function ensureTimer(){
  const qz=state.quiz;if(!qz||!qz.deadline)return;
  if(timerId!=null)return;
  const tick=()=>{
    const el=document.getElementById('timer');
    if(!el){stopTimer();return;}
    const left=qz.deadline-Date.now();
    if(left<=0){stopTimer();el.textContent='⏱ 0:00';finishQuiz();return;}
    const m=Math.floor(left/60000),s=Math.floor(left%60000/1000);
    el.textContent='⏱ '+m+':'+String(s).padStart(2,'0');
  };
  tick();
  timerId=setInterval(tick,1000);
}
function render(){
  updateBadge();navActive();
  if(state.view!=='quiz')stopTimer();
  if(state.view==='home')renderHome();
  else if(state.view==='chapters')renderChapters();
  else if(state.view==='chapter')renderChapter();
  else if(state.view==='quiz')renderQuiz();
  else if(state.view==='wrong')renderWrong();
  else if(state.view==='gates')renderGates();
  else if(state.view==='rank')renderRank();
  else if(state.view==='mnemo')renderMnemo();
  else if(state.view==='daily')renderDaily();
  else if(state.view==='about')renderAbout();
  window.scrollTo(0,0);
}
/* ---------- 首页 ---------- */
function renderHome(){
  const st=lsGet('stats',{ans:0,right:0});
  const r=rankOf(st.right),nx=rankNext(st.right);
  const dk='daily_'+ymd();
  const dv=lsGet(dk,null);
  const pct=nx?Math.round(st.right/Math.max(nx.min,1)*100):100;
  let h='<div class="rank-card" onclick="goView(\'rank\')">'
    +'<div class="rank-top"><div class="rank-ic">'+r.ic+'</div><div><div class="rank-name">'+r.n+'段位 · 已答对 '+st.right+' 题</div>'
    +'<div class="rank-sub">'+(nx?('再答对 '+(nx.min-st.right)+' 题升到 '+nx.n+' '+nx.ic):'已是最高段位！')+'</div></div></div>'
    +'<div class="rank-pbar"><i style="width:'+Math.min(pct,100)+'%"></i></div></div>';
  h+='<div class="daily-card" onclick="goView(\'daily\')"><div class="dc-ic">⚡</div>'
    +'<div class="dc-info"><div class="dc-t">每日挑战</div>'
    +'<div class="dc-s">'+(dv?('今日最高 '+dv.best+' 分 · 可反复刷'):'今天还没挑战 · 随机10题 · 限时5分钟')+'</div></div>'
    +'<div class="dc-go">'+(dv?'再战':'开战')+' ›</div></div>';
  h+='<h2 class="sec">📚 选择单元开始复习</h2>';
  DATA.units.forEach((u,ui)=>{
    const chs=u.chapters;
    const done=chs.filter(c=>chapterDone(u.id,c.id)).length;
    h+='<div class="card unit-card" onclick="openUnit('+ui+')">'

function startQuiz(mode,extra){
  extra=extra||{};
  const qz={i:0,got:0,score:0,objScore:0,objN:0,max:0,wrong:[],done:false,mode:mode,deadline:null,work:{}};
  if(mode==='wrong'){
    const wb=lsGet('wrongbook',[]);
    if(!wb.length){return;}
    qz.list=wb.map(w=>Object.assign({},w,{t:w.t||'choice'}));
    qz.title='错题重做';
  }else if(mode==='daily'){
    qz.list=shuffle(poolOfAll(),hashStr(ymd())).slice(0,10);
    qz.title='每日挑战';
    qz.deadline=Date.now()+5*60000;
  }else if(mode==='gate'){
    const u=DATA.units[state.unit],c=u.chapters[state.ch];
    const si=extra.si;const sid=c.sections[si].id||('s'+(si+1));
    qz.list=poolOfChapter(state.unit,state.ch).filter(it=>it.sec===sid);
    qz.title='闯关 · '+c.sections[si].name;
    qz.gateSi=si;qz.gateSid=sid;
  }else{
    const u=DATA.units[state.unit],c=u.chapters[state.ch];
    let pool=poolOfChapter(state.unit,state.ch);
    if(mode==='custom'){
      const pc=state.pick;
      pool=pool.filter(it=>((!it.sec||pc.secs.includes(it.sec))&&pc.lvs.includes(it.lv)));
      if(!pool.length){alert('所选范围内没有题目，请调整选择。');return;}
      qz.title='自选练习';
    }else{

    qz.list=shuffle(pool);
  }
  if(!qz.list.length){alert('这个范围内没有题目。');return;}
  qz.list.forEach(it=>{const t=qKind(it);if(t!=='essay'){qz.max+=(it.pt||1);qz.objN++;}else{qz.max+=(it.subs||[]).reduce((a,s)=>a+(s.score||0),0);}});
  state.quiz=qz;state.view='quiz';render();
}

/* ---------- 判分 ---------- */
function normAns(s){return String(s).replace(/\s+/g,'').replace(/[，。、；：！？,.;:!?（）()]/g,'').toLowerCase();}
function nearMiss(a,b){
  a=normAns(a);b=normAns(b);
  if(Math.abs(a.length-b.length)>1)return false;
  if(a===b)return true;
  const s=a.length<b.length?a:b,l=a.length<b.length?b:a;
  if(s.length===l.length){let d=0;for(let i=0;i<s.length;i++){if(s[i]!==l[i])d++;}return d<=1;}
  let i=0,j=0,d=0;while(i<s.length&&j<l.length){if(s[i]!==l[j]){d++;j++;if(d>1)return false;}else{i++;j++;}}return d<=1;
}
function submitAns(val){
  const qz=state.quiz;if(qz.done)return;
  const cur=qz.list[qz.i],t=qKind(cur);
  let res=null;
  if(t==='choice'||t==='tf')res=gradeTap(cur,val);
  else if(t==='fill')res=gradeFill(cur,val);
  else if(t==='order')res=gradeOrder(cur,val);
  else if(t==='essay')res=gradeEssay(cur,val);
  afterAnswer(cur,res);
}
function gradeTap(it,oi){
  const t=qKind(it);
  const ok=t==='tf'?((oi===0)===it.ans):(oi===Number(it.ans));
  const rightIdx=t==='tf'?(it.ans?0:1):Number(it.ans);
  const optEls=document.querySelectorAll('.opt');
  optEls.forEach(o=>o.classList.add('dim'));
  const fb=document.getElementById('fb');
  if(ok){
    optEls[oi].classList.add('right');
    fb.className='fb ok';fb.innerHTML='🎉 '+(PRAISE[Math.floor(Math.random()*PRAISE.length)])+'<span class="why">📝 解析：'+esc(it.why)+'</span>';
  }else{
    optEls[oi].classList.add('wrong');optEls[rightIdx].classList.add('right');
    fb.className='fb bad';fb.innerHTML='❌ 答错了<span class="why">📝 解析：'+esc(it.why)+'</span>';
  }
  return {ok:ok,got:ok?(it.pt||1):0,html:fb.innerHTML};
}
function matchFill(s,al){
  s=normAns(s);
  if(s.length<2)return false;  // 少于2个字不判（防虚词/误触）
  return al.some(a=>{
    const na=normAns(a);
    if(s===na)return true;
    // 关键词判定：孩子的答案含标准答案（或其关键词），或反之——有关键词就判对
    return (na.length>=2&&s.includes(na))||(s.length>=2&&na.includes(s));
  });
}
function gradeFill(it,arr){
  const pairs=(it.a||it.ans);
  const okAll=pairs.every((al,k)=>matchFill(arr[k],al));
  const near=pairs.some((al,k)=>!matchFill(arr[k],al)&&al.some(a=>nearMiss(arr[k],a)));
  const ansShow=pairs.map(al=>al[0]).join('、');
  const fb=document.getElementById('fb');
  if(okAll){
    fb.className='fb ok';fb.innerHTML='🎉 填空正确！<span class="why">📝 解析：'+esc(it.why)+'</span>';
  }else{
    fb.className='fb bad';
    fb.innerHTML='❌ 有空格不对<span class="why">📝 答案：'+esc(ansShow)+'｜解析：'+esc(it.why)+'</span>'
      +(near?'<button class="btn2" style="margin-top:8px" onclick="fillOverride()">我写的其实是对的（拼写小误差）</button>':'');
  }
  return {ok:okAll,got:okAll?(it.pt||1):0,html:fb.innerHTML,near:near};
}
function fillOverride(){
  const qz=state.quiz,cur=qz.list[qz.i];
  qz.work.fillOverride=true;
  afterAnswer(cur,{ok:true,got:(cur.pt||1),html:'👍 算你对！<span class="why">📝 解析：'+esc(cur.why)+'</span>',override:true});
}
function gradeOrder(it,seq){
  const qz=state.quiz,shuf=qz.work.shuf;
  const ok=seq.length===it.items.length&&seq.every((d,k)=>shuf[d]===k);
  const fb=document.getElementById('fb');
  if(ok){
    fb.className='fb ok';fb.innerHTML='🎉 顺序完全正确！<span class="why">📝 解析：'+esc(it.why)+'</span>';
  }else{
    fb.className='fb bad';fb.innerHTML='❌ 顺序有误<span class="why">📝 正确顺序：'+esc(it.items.join(' → '))+'｜解析：'+esc(it.why)+'</span>';
  }
  return {ok:ok,got:ok?(it.pt||1):0,html:fb.innerHTML};
}
function gradeEssay(it,ks){
  let got=0,full=true;
  it.subs.forEach((s,si)=>{
    const k=ks[si]||0;got+=Math.round((s.score||0)*k);
    if(k!==1)full=false;
  });
  const fb=document.getElementById('fb');
  const max=(it.subs||[]).reduce((a,s)=>a+(s.score||0),0);
  if(full){
    fb.className='fb ok';fb.innerHTML='🏆 全部要点都答到了，满分 '+max+' 分！<span class="why">📝 解析：'+esc(it.why)+'</span>';
  }else{
    fb.className='fb bad';fb.innerHTML='📝 自评得分 '+got+' / '+max+' 分<span class="why">没答全的要点要记住哦：'+esc(it.why)+'</span>';
  }
  return {ok:full,got:got,html:fb.innerHTML};
}
function afterAnswer(cur,res){
  const qz=state.quiz;
  qz.got+=res.got;
  if(res.ok){qz.score++;if(qKind(cur)!=='essay')qz.objScore++;}
  else if(!res.override)qz.wrong.push(cur);
  statsAdd(res.ok,qKind(cur)==='essay'?res.got:0);
  qz.done=true;
  const nb=document.getElementById('nextbtn');
  nb.style.display='block';
  nb.textContent=(qz.i<qz.list.length-1)?'下一题 →':'查看成绩 🏁';
}
/* ---------- 收尾 ---------- */
function nextQ(){
  const qz=state.quiz;
  if(qz.i<qz.list.length-1){qz.i++;qz.done=false;qz.work={};renderQuiz();}
  else{finishQuiz();}
}
function quitQuiz(){
  stopTimer();
  if(state.quiz&&state.quiz.mode==='wrong')state.view='wrong';
  else if(state.quiz&&state.quiz.mode==='gate')state.view='gates';
  else if(state.quiz&&state.quiz.mode==='daily')state.view='daily';
  else state.view='chapter';
  state.quiz=null;render();
}
function finishQuiz(){
  stopTimer();
  const qz=state.quiz,n=qz.list.length;
  const pct=qz.max?Math.round(qz.got/qz.max*100):0;
  const pctObj=qz.objN?Math.round(qz.objScore/qz.objN*100):0;
  if(qz.mode==='wrong'){
    const wb=lsGet('wrongbook',[]);
    const keep=qz.wrong.map(w=>keyOf(w));
    wb.forEach(w=>{if(!keep.includes(keyOf(w)))wrongRemove(w);});
  }else{
    qz.wrong.forEach(w=>wrongAdd(w));
    if(qz.mode==='chapter'&&pctObj>=60){const u=DATA.units[state.unit];setDone(u.id,u.chapters[state.ch].id,true);}
    if(qz.mode==='daily'){
      const dk='daily_'+ymd();
      const old=lsGet(dk,null);
      if(!old||pct>old.best)lsSet(dk,{best:pct,right:qz.score,total:n,ts:Date.now()});
    }
    if(qz.mode==='gate'&&pctObj>=80)gatePass(qz.gateSi,pctObj);
  }
  const st=lsGet('stats',{ans:0,right:0});
  const r=rankOf(st.right),nx=rankNext(st.right);
  const stars=pct>=90?'⭐⭐⭐':pct>=70?'⭐⭐':pct>=60?'⭐':'';
  const msg=pct>=90?'完美通关！知识全在脑子里了！':pct>=70?'掌握得不错，错题多看看！':pct>=60?'及格啦！把错题本过一遍更稳！':(TRYAGAIN[Math.floor(Math.random()*TRYAGAIN.length)]);
  const wl=qz.wrong.map((w,i)=>'<div style="padding:4px 0;border-bottom:1px dashed #f0d5d8">'+(i+1)+'. '+esc(w.q)+'</div>').join('');
  let gateNote='';
  if(qz.mode==='gate'){
    gateNote=pctObj>=80?'<div class="score-msg" style="color:#1e7a48;font-weight:700">🎉 闯关成功！下一节已解锁！</div>':('<div class="score-msg">闯关需答对80%（客观题），再来一次！</div>');
  }
  app.innerHTML='<div class="card score-box">'
    +'<div class="score-emoji">'+(pct>=90?'🏆':pct>=70?'🎉':pct>=60?'😊':'💪')+'</div>'
    +'<div class="score-num">'+qz.score+' / '+n+' 题'+(qz.mode==='daily'?' · '+pct+'分':'')+'</div>'
    +'<div class="score-stars">'+stars+'</div>'
    +'<div class="score-msg">'+msg+'　'+r.ic+' '+r.n+'段位'+(nx?' · 再对'+(nx.min-st.right)+'题升'+nx.n:'')+'</div>'
    +gateNote
    +(qz.wrong.length?'<div class="wrong-mini"><b>本次错题：</b>'+wl+'</div>':'<div class="score-msg" style="color:#1e7a48">全对！一个错题都没有！🎊</div>')
    +'<div class="btn-row"><button class="next-btn" onclick="startQuiz(\''+qz.mode+'\','+(qz.mode==='gate'?'{si:'+qz.gateSi+'}':'{}')+')">再来一遍 🔄</button>'
    +'<button class="btn2" onclick="afterQuiz()">完成 ✅</button></div></div>';
}
function afterQuiz(){
  const m=state.quiz?state.quiz.mode:'chapter';
  state.quiz=null;
  if(m==='wrong')state.view='wrong';
  else if(m==='gate')state.view='gates';
  else if(m==='daily')state.view='daily';
  else{state.view='chapter';state.tab='points';}
  render();
}
/* ---------- 错题本 ---------- */
function ansText(w){
  const t=w.t||w.type||'choice';
  if(t==='tf')return w.ans?'✔ 正确':'✘ 错误';
  if(t==='fill')return ((w.a||w.ans||[[]])[0]&&(w.a||w.ans)[0][0])||'见解析';
  if(t==='order')return w.items?w.items.join(' → '):'见解析';
  if(t==='essay')return '见要点（重做时对照）';
  if(w.opts&&w.opts[w.ans]!=null)return optText(w.opts[w.ans]);
  return '';
}
function renderWrong(){
  const wb=lsGet('wrongbook',[]);
  if(!wb.length){
    app.innerHTML='<div class="card score-box"><div class="score-emoji">🎊</div><div class="score-num" style="font-size:1.1rem">错题本是空的！</div><div class="score-msg">做题时答错的题会自动收集到这里，方便反复复习。</div><button class="next-btn" onclick="goHome()">去学习 📚</button></div>';
    return;
  }
  let h='<div class="back-row"><div class="ch-title">📕 错题本（'+wb.length+'题）</div></div>';
  h+=wb.map((w,i)=>{
    const t=w.t||w.type||'choice';
    return '<div class="wrong-item"><span class="w-tag">'+esc(w.chn||'')+' · '+(KIND[t]?KIND[t].n:'选择')+'</span>'
      +'<div class="w-q">'+(i+1)+'. '+esc(w.q||'')+'</div>'
      +'<div class="w-a">正确答案：<b>'+esc(ansText(w))+'</b></div>'
      +(w.why?'<div class="w-why">📝 '+esc(w.why)+'</div>':'')+'</div>';
  }).join('');
  h+='<div class="btn-row"><button class="next-btn" onclick="startQuiz(\'wrong\')">错题重做 🔁</button>'
    +'<button class="btn2" style="color:#c0392b;border-color:#c0392b" onclick="clearWrong()">清空错题本 🗑</button></div>';
  app.innerHTML=h;
}
function clearWrong(){if(confirm('确定清空所有错题吗？')){lsSet('wrongbook',[]);updateBadge();render();}}
/* ---------- 每日挑战 ---------- */
function renderDaily(){
  const dk='daily_'+ymd();
  const dv=lsGet(dk,null);
  let h='<div class="back-row"><button class="back-btn" onclick="goHome()">← 返回</button><div class="ch-title">⚡ 每日挑战</div></div>';
  h+='<div class="card"><div style="font-weight:800;font-size:.95rem;color:#8a5a00;margin-bottom:8px">规则</div>'
    +'<p style="font-size:.83rem;color:#54636e;line-height:1.8">①每天从全册随机抽 10 题，限时 5 分钟；②同一人当天反复进入拿到同一套题，刷的是速度不是运气；③只记当日最高分；④答对的题累计进段位。</p>'
    +(dv?'<div style="margin-top:10px;font-size:.85rem;color:#2b4a3d;font-weight:700">今日最高：'+dv.best+' 分（'+dv.right+'/'+dv.total+' 题）</div>':'')
    +'<button class="next-btn" onclick="startQuiz(\'daily\')">'+(dv?'再战今日挑战 ⚡':'开始今日挑战 ⚡')+'</button></div>';
  app.innerHTML=h;
}
/* ---------- 闯关 ---------- */
function gateKey(uid,cid){return 'gate_'+uid+'_'+cid;}
function gateState(uid,cid){return lsGet(gateKey(uid,cid),{});}
function gatePass(si,pct){
  const uid=DATA.units[state.unit].id,cid=DATA.units[state.unit].chapters[state.ch].id;
  const g=gateState(uid,cid);
  const old=g[si]||{};
  g[si]={p:1,best:Math.max(old.best||0,pct)};
  lsSet(gateKey(uid,cid),g);
}
function renderGates(){
  const u=DATA.units[state.unit],c=u.chapters[state.ch];
  const g=gateState(u.id,c.id);
  let h='<div class="back-row"><button class="back-btn" onclick="goBackChapters()">← 返回</button><div class="ch-title">🎮 闯关 · '+esc(c.name)+'</div></div>';
  h+='<div class="card"><p style="font-size:.8rem;color:#8a97a3;line-height:1.7">按节逐关挑战：本节的题答对80%以上，自动解锁下一节。全部通关你就是本章擂主！</p></div>';
  c.sections.forEach((s,si)=>{
    const sid=s.id||('s'+(si+1));
    const unlocked=(si===0)||!!g[si-1];
    const passed=!!g[si];
    h+='<div class="gate-item'+(unlocked?'':' lock')+'" '+(unlocked?'onclick="startGate('+si+')"':'')+'>'
      +'<div class="gate-no">'+(passed?'✓':(si+1))+'</div>'
      +'<div class="gate-info"><div class="gate-name">'+esc(s.name)+'</div>'
      +'<div class="gate-meta">'+(passed?('已通关 · 最高 '+g[si].best+'%'):(unlocked?'点击开始闯关':'先通过上一关'))+'</div></div>'
      +'<div class="gate-go">'+(passed?'✅':(unlocked?'挑战 ›':'🔒'))+'</div></div>';
  });
  app.innerHTML=h;
}
function startGate(si){
  state.tab='quiz';
  startQuiz('gate',{si:si});
}
/* ---------- 段位 ---------- */
function renderRank(){
  const st=lsGet('stats',{ans:0,right:0});
  const r=rankOf(st.right),nx=rankNext(st.right);
  let h='<div class="back-row"><button class="back-btn" onclick="goHome()">← 返回</button><div class="ch-title">🏆 段位称号</div></div>';
  h+='<div class="rank-card"><div class="rank-top"><div class="rank-ic">'+r.ic+'</div><div><div class="rank-name">'+r.n+'段位</div>'
    +'<div class="rank-sub">累计答对 '+st.right+' 题 · 共答题 '+st.ans+' 题</div></div></div>'
    +'<div class="rank-pbar"><i style="width:'+(nx?Math.round(st.right/Math.max(nx.min,1)*100):100)+'%"></i></div>'
    +'<div class="rank-sub" style="margin-top:6px">'+(nx?('再答对 '+(nx.min-st.right)+' 题升到 '+nx.n+' '+nx.ic):'已是最高段位！')+'</div></div>';
  RANKS.forEach(x=>{
    h+='<div class="card unit-card"><div class="unit-emoji" style="font-size:1.5rem">'+x.ic+'</div>'
      +'<div class="unit-info"><div class="unit-name">'+x.n+(x===r?'（当前）':'')+'</div>'
      +'<div class="unit-meta">累计答对 '+x.min+' 题'+(x===RANKS[0]?'以上':'解锁')+'</div></div></div>';
  });
  app.innerHTML=h;
}
/* ---------- 口诀卡 ---------- */
function renderMnemo(){
  let h='<div class="back-row"><button class="back-btn" onclick="goHome()">← 返回</button><div class="ch-title">🧠 记忆口诀卡</div></div>';
  let n=0;
  DATA.units.forEach(u=>{
    u.chapters.forEach(c=>{
      const items=[];
      c.sections.forEach(s=>{if(s.mn)items.push({t:s.name,mn:s.mn});s.points.forEach(p=>{if(p.mn)items.push({t:p.t,mn:p.mn});});});
      c.keypoints.forEach(k=>{if(k.mn)items.push({t:k.t,mn:k.mn});});
      if(items.length){
        h+='<h2 class="sec">'+u.emoji+' '+esc(c.name)+'</h2>';
        items.forEach(it=>{n++;h+='<div class="mn-card"><div class="mn-t">'+esc(it.t)+'</div><div class="mn-m">'+esc(it.mn)+'</div></div>';});
      }
    });
  });
  if(!n)h+='<div class="card score-box"><div class="score-emoji">🧠</div><div class="score-msg">口诀还在收集中，先去看看知识点吧！</div></div>';
  app.innerHTML=h;
}
/* ---------- 关于 ---------- */
function renderAbout(){
  app.innerHTML='<div class="card about">'
    +'<h3>📕 关于本复习助手</h3>'
    +'<p>内容依据 <b>部编版（人民教育出版社）义务教育教科书·中国历史七年级上册（2024秋版）</b> 整理，适用于江苏徐州初一学生。</p>'
    +'<h3>🧭 怎么用</h3>'
    +'<p>①按单元逐章学习“知识点”，重点看🔑标记和“重点”页；②考前重点过“易错点”页，考试避坑；③学完做“练习”，答对率60%以上自动标记已掌握；④错题自动进错题本，反复重做到全会为止。</p>'
    +'<h3>🎮 趣味玩法</h3>'
    +'<p>⚡每日挑战：每天10题限时赛；🏆段位称号：答题升级青铜→白银→黄金→王者；🎮闯关模式：按节逐关解锁；🧠记忆口诀卡：顺口溜背得快。</p>'
    +'<h3>📱 离线使用</h3>'
    +'<p>本文件是单文件网页，不需要联网。发送到手机后用浏览器打开即可；建议收藏到浏览器书签或添加到桌面。</p>'
    +'<h3>⚠️ 说明</h3>'
    +'<p>内容依据教材整理，供复习参考；具体考点范围请以学校老师要求为准。发现内容有误可直接告诉我修改。</p>'
    +'</div>';
}
document.getElementById('nav').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  const v=b.dataset.v;
  if(v==='home')state.view='home';
  else if(v==='wrong')state.view='wrong';
  else if(v==='about')state.view='about';
  stopTimer();state.quiz=null;render();
});
render();
</script>
